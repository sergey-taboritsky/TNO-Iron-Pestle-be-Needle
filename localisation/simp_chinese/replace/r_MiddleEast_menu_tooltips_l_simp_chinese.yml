l_simp_chinese:
 TNO_menupic_tooltip_1: "§Y倘若暴力捂住了萨阿德的喉舌，那么他的伴侣将在神与祖国的见证下代替她丈夫继续战斗。§!" #If the brute English force has arrested Saad and his tongue, then his wife and life partner is making God and the homeland witness that she will replace her great husband. - Safiya Zhagloul
 TNO_menupic_tooltip_2: "§B我自信于一个事实：将我们两国相连的友谊会得到您提及的一切官方与私人力量的巩固。§!" #I am confident that the kinds of friendship which join our two countries will be reinforced by the official and personal relations to which you referred in your letter. - Nazim Qudsi
 TNO_menupic_tooltip_3: "§x民族阵线的性质与任何相似的民族解放运动一致——运动的主力是工人、农民、小资产阶级以及一切反对殖民主义的力量，阵线也就成为他们理想的化身。§!" #The political character of the Front was defined like that of any other national liberation movement by its struggle against colonialism. We considered that the main forces of the movement were the workers, the peasantry, the petty bourgeoisie, and those other sections of society opposed to colonialism, and the Front was the organisation which embodied their aspirations. - Abd al-Fattah Ismail
 TNO_ugly_american_icon_tt: "§Y沙上建塔§!"
 TNO_ugly_american_icon_tt_delayed: "在黎凡特与阿拉伯半岛的风沙之下，没有哪一座宫殿是建在岩石上的。\n\n二十世纪的这片土地，是一张刚被帝国之手重新折叠的地图。奥斯曼帝国的崩塌、委任统治的划线、石油与意识形态的涌入，把埃及、叙利亚与也门一同推上了一段没有蓝图的实验。此地的每一届政府、每一位君主、每一次兵变，都像在流沙之上垒砌高塔——你看得见塔尖刺破天际，却总听见脚下的沙在缓慢移动。\n\n尼罗河畔，立宪君主制的合法性悬而未决——王室与意大利监护者之间，自由派与保守派拉锯不休，苏伊士的幽灵与石油危机的悬剑始终压在国运之上；北方，叙利亚因与土耳其的合作而重生，阿勒颇的商栈重新填满来自小亚细亚的货箱，而同一股潮流却让深居南方的大马士革被悄然绕过，军人干政的循环、复兴党的崛起与哈塞克的库尔德问题，共同织成一张脆弱的网；半岛西南，仿佛天翻地覆又仿佛毫无变化的曼苏里亚王国延续着伊玛目与部落长老共治的旧秩序，隐患却已在地平线上浮现。\n\n愿你在流沙之上，建起属于你的高塔。"