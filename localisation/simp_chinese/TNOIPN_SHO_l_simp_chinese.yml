 SHO_Fujiwara_Iwaichi: "藤原岩市"
 SHO_Fujiwara_Iwaichi_DESC: "昭南驻棉兰联络官，帝国陆军中将，F 机关的创始人。他是这部戏里唯一一个在 1942 年就认识所有人的人。\n\n1908 年生，1939 年进参谋本部搞南洋情报，1941 年 9 月创立 F 机关，座右铭是「究極の誠意」。他的任务清单是联络印度独立运动、华侨与马来苏丹，而他在本世界线里的履历几乎就是一份建国人事档案：他派人在吉打找到宗教教师 Sahid Abu Bakar，随后接触亚齐的 PUSA——1942 年 3 月 11 日夜，F 机关人员与 PUSA 非正规军攻下班达亚齐，次日清晨日本近卫师团登陆时城已经在手里；他救出吉打苏丹阿卜杜勒·哈米德·哈林及其家族；他试图动员马来青年同盟（KMM），因为英方开战即逮捕了它的大部分领导人而收效有限；他在西苏门答腊投入大量资源，并追查到了苏加诺在巴东的藏身处。战争结束时他驻新加坡。\n\n1962 年他坐在棉兰的国安会会议室里，不是成员，但每次都在场。他扶起过的亚齐 PUSA 后来被日本翻脸镇压，成了共和国唯一的血债；他找过的 KMM 后来被日本取缔，却在 1947 年得到了它梦寐以求的版图；他找出来的苏加诺现在被软禁在他驻在的这座城邦旁边；他经营过的米南加保高地现在出了统治这个国家的那批人。他知道这些事是怎么发生的，因为他经手。"
 ABD_Baba_Masao: "马场正郎"
 ABD_Baba_Masao_DESC: "北婆罗洲陆军军政长官，帝国陆军中将。1943 年 9 月起任苏门答腊第 4 师团长，后任婆罗洲第 37 军司令，1944 年 12 月起兼沙巴军政长官。\n\n1892 年生于熊本，骑兵出身，历经第 53 师团长、苏门答腊第 4 师团长，最后到婆罗洲。在婆罗洲他主持的是内陆的反游击作战——这项工作在架空线里从未结束，因为日本从未离开。\n\n加里曼丹被切成两块：北边归陆军，南边归海军。两边各有各的司令部、各有各的宪兵队、各有各的谍报网，也各有各的账本。他不只对丛林里的游击队作战，也对海军那一边作战——争码头、争橡胶、争石油配额，争谁能先把当地的合作者变成自己的人。1962 年他七十岁，还在任上。"
 JJK_Maeda_Tadashi: "前田精"
 JJK_Maeda_Tadashi_DESC: "贾加鲁塔民政长官兼努山塔拉邦联秘书长，帝国海军中将。日本在南洋的另一只手——藤原管枪，他管学校。\n\n1898 年生于鹿儿岛加治木，士族出身，父亲是校长。1940 年任驻荷兰武官，十月赴巴达维亚谈判石油，同时受命搞情报，与西岛重忠等日本平民合作在土著社群建立第五纵队。1942 年 8 月派驻巴达维亚，任第 16 军与海军之间的联络官。1944 年 10 月小矶国昭许诺印尼独立之后，他出资办了印尼独立养正塾，公开说法是为印尼培养下一代领导者。\n\n那所学校是印尼左翼的摇篮：学员包括艾地、卢克曼、西迪·克塔帕蒂、查利德·拉希迪，主持人是亲苏的印尼共领导人维卡纳。沙里尔当时就怀疑它的真正目的是培养渗透分子打进左翼地下组织并使之分化；还有记载称前田等人暗中支持过陈马六甲。1945 年 8 月 17 日凌晨，苏加诺、哈达与苏巴佐在他家起草了独立宣言。\n\n在架空线里，学校没有随着战争结束而关门——它成了努山塔拉邦联的干部养成所，办了将近二十年。1962 年他六十四岁，仍然坚持自己当年是真诚支持印尼独立的，而且愿意对任何愿意听的人讲一遍。他最得意的作品，现在在棉兰的地下。"