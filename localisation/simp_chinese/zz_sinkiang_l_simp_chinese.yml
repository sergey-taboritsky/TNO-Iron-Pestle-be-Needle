 china_faction_tenets_communist_desc: "§L布尔什维主义起源于一战之前的俄国社会民主工党，在如今名动世界的俄罗斯革命者、曾经苏维埃共和国的领袖弗拉基米尔·列宁在马克思、恩格斯及其后继者们的基础上总结出了理论上适用于俄国和新世界格局的方法论，并在1917年十月政变后在俄国西部推行其政策。\n\n尽管布尔什维克最终战败，但其思想作为一种激进理念仍然受到许多革命者追随——无论如何，布尔什维克在实质上领导俄国数年之久，而其失败也并非全部出自理念因素。这一思想与中国的碰撞尤为有趣：在南方尤其是广州，第三国际派遣的俄国流亡红军成员帮助国民党进行改组，顺势也将布尔什维主义思想埋在党内最深处；工团党与其他小型激进左翼组织更是存在许多马克思主义的公开信徒，而布尔什维主义在其中同样成为显学。\n\n然而，布尔什维主义在中国最纯正的化身并非国民党或工团党，而是远在西北大漠中流亡的红军残部，及当地以相似原则组织起来的一系列国民党人与社会主义者——也就是中国共产党。如今，该党在奇迹般地取得了公开政权之后，正在谋求将其思想传播到全国各地，乃至更为广泛的世界中。§!"
 CPC_set_leader_tt: "§e$CHN_assume_tt$中国共产党的全国领导权§!"