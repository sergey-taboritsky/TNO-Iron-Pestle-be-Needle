## Characters ##
 DMS_Kartosuwiryo: "卡尔托苏维约"
 DMS_Kartosuwiryo_DESC: "达鲁伊斯兰（Darul Islam）领袖，西爪哇伊斯兰国最高权威。\n\n卡尔托苏维约1905年生于中爪哇 Cepu（塞普，石油小镇），父亲是地方小官吏。他早年学医（NIAS），但在泗罗期间寄住于伊斯兰领袖 Tjokroaminoto 家中，深受其影响投身 PSII（伊斯兰联合党），后放弃医学彻底从政。\n\n1937年他离开 PSII，另组政治运动，主张建立以伊斯兰法为基础的印度尼西亚国家。二战期间他在西爪哇 Garut（加鲁特）一带组织武装民兵——这些日占时期由日本武装起来的团体，正是日后达鲁伊斯兰的班底。\n\n1949年8月7日，他正式宣布建立「印度尼西亚伊斯兰国」（Negara Islam Indonesia），自任伊玛目（Imam），并在1950年代控制西爪哇约三分之一土地，游击武装达1.5万人。\n\n在架空线中，卡尔托苏维约是 DMS（DMS=西爪哇伊斯兰国）的建立者与最高精神权威。他视 RSM（印度尼西亚民族共和国）为「叛教者的世俗政权」，宣称只有伊斯兰法才能统一印尼。他以「伊斯兰弧形」串联西爪哇与亚齐——亚齐的达乌德·贝鲁埃曾于1955年出任其副伊玛目，一旦北苏门答腊呼应，便对棉兰形成南北夹击之势。\n\n历史上他于1962年5月在加鲁特附近的格伯山被俘，9月5日被雅加达军事法庭判处死刑并执行枪决。但在架空线中，日本出于制衡爪哇与雅加达的考量，使其得以存续至独立战争之后。"
 DMS_Amir_Fatah: "阿米尔·法塔赫"
 DMS_Amir_Fatah_DESC: "达鲁伊斯兰西爪哇战地司令，反 RSM 圣战前线指挥官。\n\n法塔赫是西爪哇人，早年加入卡尔托苏维约的达鲁伊斯兰组织，长期活跃于爪哇乡间的清真寺网络与地方武装之间。\n\n在 OTL 达鲁伊斯兰叛乱期间，他以野外战术与对爪哇中部地形的熟稔运用，成为 DI 在西爪哇最重要的战地指挥者之一。\n\n在架空线中，阿米尔·法塔赫是 DMS 的野战指挥官，代表该国的武力支柱：他既服从伊玛目的宗教权威，又以军事现实修正极端教法。在 DMS 与 RSM（印度尼西亚民族共和国）的长期对峙中，他负责西线战场的消耗与游击，是压在其世俗对手心头的一柄利刃。"
