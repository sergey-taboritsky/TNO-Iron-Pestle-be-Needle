### Ideas ###
 IPN_SYR_twenty_independent_years: "二十载独立时光"
 IPN_SYR_twenty_independent_years_desc: "自从1941年英军驱逐维希法国驻军，库阿特利总统公布《独立宣言》后，叙利亚共和国已经在名义上享受了超过二十年的独立。作为阿拉伯世界的首个稳定运行的民主共和国，叙利亚在此期间积攒了大量文化与经济收益，并使得本国相对中东普遍现状而言表现出与其资源禀赋不相称的经济繁荣。"
 IPN_SYR_democratic_republic_entrenched: "第三共和国：§G稳定§!"
 IPN_SYR_democratic_republic_entrenched_desc: "自从扎伊姆军政府倒台，第三共和国成立之后，由人民党与民族党温和派共同掌握的叙利亚政局似乎已经维持了相当久的稳态。无论是希沙克利的政变企图还是意大利对南方的渗透，均呈完全失败的状态——这当然要得益于我国的共和友邦与保护者，也就是土耳其共和国在各大城市和交通要道的驻军，但这种稳定与民众对当今秩序的配合也同样脱不开关系。"
 IPN_SYR_democratic_republic_shaky: "第三共和国：§Y骚动§!"
 IPN_SYR_democratic_republic_chaotic: "第三共和国：§R暴乱§!"
 IPN_SYR_aleppo_ascendant: "阿勒颇得势"
 IPN_SYR_aleppo_ascendant_desc: "叙利亚长期在国内经济版图上分裂为两个不同的经济中心及其附属区域——首都大马士革，以及北方重镇阿勒颇。由于幼发拉底河的存在，阿勒颇在经济层面与大马士革并无许多共同语言，反而与河流上下游的土耳其与伊拉克联系紧密。\n\n随着土耳其实质性的控制叙利亚，阿勒颇权贵集团及其代言人——叙利亚人民党也得以上台长期执政，并反过来为阿勒颇的经济活动提供庇护。只要土耳其把控全局，现状就会继续稳定下去......"
 IPN_SYR_peoples_muttering: "民众的低语"
 IPN_SYR_peoples_muttering_desc: "自1946年扎伊姆政变以来，叙利亚已经积累了太多悬而未决的问题，而如今这些问题正在被有心之人反复提及，从而激起民间令人不安的低语。哈希姆君主制同情者，希沙克利残余，共产党人，复兴主义者，叙利亚社会民族党，穆斯林兄弟会，以及长期得不到关注的大马士革及其周边的居民和经济界人士......如今他们仍然四分五裂，在国防军和土耳其军队的打击下无所遁形，但此类人物的现身频率正在呈现出令人不安的趋势。"

### Assorted Laws ###
 IPN_SYR_Current_Constitution: "《§G第三§!§W共和国§!§B宪法§!》"
 IPN_SYR_Current_Constitution_desc: "1949年制宪议会在土耳其默许下起草、并于1950年颁布的《第三共和国宪法》确立了议会共和政体：总统由众议院选举产生，内阁对众议院负责。自扎伊姆军政府倒台以来，这部宪法既未因1952年希沙克利政变企图而中断，也始终未被任何军政府或外部合并所取代，连续有效至今，构成了以人民党为主导的议会秩序之法律基石。"
 IPN_SYR_Election_Law: "§R翻新§!《选举法》"
 IPN_SYR_Election_Law_desc: "历次修订的《选举法》在单一选区、两轮多数制与席位分配上做出倾斜，使以阿勒颇为根基的人民党得以在历次大选中得以在其他政治力量盘根错节的南方稳守基本盘，并形成与民族党温和派之间可预期的旋转轮替。这套制度构成了第三共和国时期叙利亚稳定运行的选举地基。"
 IPN_SYR_Oil_Pipeline_Law: "《§G输油管道§!管理条例》"
 IPN_SYR_Oil_Pipeline_Law_desc: "依据与土耳其经济圈达成的油管过境框架，《输油管道管理条例》规范了跨国油气管线在叙境内的过境、养护与利润分配。叙方据协议享有可观的过境利润分成，而阿勒颇商帮正是这一收益最主要的受益者，也使亲土的经济—外交议程在议会中拥有稳固的票仓。"
 IPN_SYR_Turkey_Trade_Law: "《§G叙§!§R土§!通商条约总集》"
 IPN_SYR_Turkey_Trade_Law_desc: "《叙土通商条约总集》汇集了1944年土耳其接管以来叙土双方陆续缔结的关税同盟、自由贸易与基础设施互联互通等一系列经贸协定。这套条约体系将叙利亚的经济命脉系于安卡拉主导的经济圈之上，既是亲土政策的法律凭依，也是阿勒颇权贵集团商业利益的保护伞。"
 IPN_SYR_Land_Reform_Aborted: "流产的《§Y土地§!改革法》"
 IPN_SYR_Land_Reform_Aborted_desc: "面对城乡悬殊与无地农民的压力，历届政府曾数度提出限制大地产、分配国有土地的《土地改革法》草案。然而，议会屡次以维护财产权与秩序为由将其封杀。这部法律至今仍停留在提案阶段，成为制约叙利亚社会结构变革的最大悬案。"
 IPN_SYR_French_Treaty: "履行《§B法§!§G叙§!条约》"
 IPN_SYR_French_Treaty_desc: "《1936年法叙条约》是法国委任统治末期与叙利亚谈判缔结的独立条约，曾由当时的众议院批准，被视为走向完全独立的法律标志。随着1944年土耳其接管叙利亚，以及战后维希法国彻底成为唯一合法的法国政府，《法叙条约》得以完全履行，并作为叙土关系取代法叙关系成为叙利亚对外关系主轴这一变化的实质性确认。如今，由于土耳其与德国关系恶化导致的叙利亚与法国关系的疏远，该条约在事实上已为一系列叙土协定所取代，仅作为旧时代的法统残影留存于法典之中。"

### Event ###
 IPN_SYR_news.1.t: "[Get_newspaper_header]叙利亚政府危机"
 IPN_SYR_news.1.desc: "由于欧洲近期的经济波动，叙镑在近几个月迅速贬值，叙利亚经济也同时陷入严重困境。就在今天，这一经济波动似乎已经传递到了政治层面——议会中民族党的部分议员突如其来地发动了对总统鲁什迪·基赫亚的弹劾，如今弹劾案已经进入议会程序。\n\n总统及其人民党的根基是阿勒颇与幼发拉底河流域的亲土经济寡头，而民族党及其代表的大马士革居民显然与政府积怨已久。此外，民族党背后似乎存在希望动摇土耳其对叙利亚控制的另一方外国势力插手。叙利亚局势正在面临巨大的不确定性。"
 IPN_SYR_news.1.a: "螳螂捕蝉，黄雀在后？"
