 BRU_Ahmad_Azahari: "阿末·阿扎哈里"
 POLITICS_A_M_AZAHARI_DESC: "谢赫艾哈迈德·阿扎哈里·本·谢赫·马哈茂德，通称阿末·阿扎哈里，1928 年生于纳闽。其母为文莱马来人，祖父谢赫·阿卜杜勒·哈米德有阿拉伯血统，「谢赫」因此进入他的名字。通过家庭关系，他自幼结识文莱第 27 任苏丹艾哈迈德·塔朱丁的弟弟奥马尔·阿里·赛义夫丁，并就读于文莱市的天主教传教学校学习英语。15 岁那年，他前往已在日本占领下的爪哇学习兽医。\n\n在爪哇他结识了此生最关键的一个人——穆罕默德·哈达，并由此卷进印尼民族主义的学生圈。1946 至 1947 年的分治把「印度尼西亚」拆成了十几块：爪哇归日惹苏丹国，群岛东部被锁进努山塔拉邦联，加里曼丹则成了日本海陆两军的军属殖民地。作为一个婆罗洲人，他在这场分赃里没有祖国可回，只能带着爪哇学到的那套组织技术回到文莱。\n\n1955 年 1 月，他与文莱文学家沙利·马斯里共同创建文莱人民党，主张彻底的反殖民斗争，并把矛头直接指向苏丹的专制君主制。1958 年他获委任为文莱咨议局议员，借此身份组建了党的准军事组织北加里曼丹国民军。\n\n1962 年他站在起事的门槛上：一边是日本的军政当局与苏丹，一边是砂拉越人民联合党、婆罗洲反日同盟这些各怀主张的同盟者。他要的是北婆罗洲共和国，而他能拿到的取决于昭南的宪兵队什么时候腾出手来。"
