l_simp_chinese:/n ## IPN: 南婆罗洲（加里曼丹）— 日本海军军政与坤甸合作政权 ##

 ABD_Kamada_Michiaki: "鎌田道章"
 ABD_Kamada_Michiaki_DESC: "第 22 特别根据地队司令官，帝国海军中将，荷属婆罗洲海军军政长官。加里曼丹的北半边与整条海岸线归他管。\n\n1890 年生于爱媛，1911 年海军兵学校第三十九期毕业。1941 年晋少将，在新几内亚第八舰队任职期间下令处决过三名盟军战俘——其中伦纳德·西弗利特那次留下了照片，是整场战争里唯一被拍下来的西方战俘斩首。1944 年 8 月 23 日出任第 22 特别根据地队司令官，驻巴厘巴板，自此成为荷属婆罗洲的军政长官。\n\n婆罗洲被切成两半：沿海、石油带与内河归海军，也就是他；南加里曼丹与内陆归陆军第 37 军，也就是马场正郎。两边各有宪兵队、各有谍报网、各有账本，争的是码头、橡胶与石油配额。他名下那份账本最重的一笔是坤甸事件——1943 至 1944 年，海军在西加里曼丹逮捕并屠杀了逾两万人，包括坤甸、三发、坤甸以外十一个苏丹国的全部苏丹。在他的世界里，这笔账 1947 年 10 月 18 日由荷兰军事法庭在坤甸结清，用的是绞刑。\n\n在这个世界线里没有那个法庭。他七十二岁，还在任上，还在跟陆军抢巴厘巴板的油。而他扶起来的那个合作政权，元首是他在 1944 年亲手杀光了全家的那位苏丹的独子。"
 ABD_Sultan_Hamid_II: "苏丹哈米德二世"
 ABD_Sultan_Hamid_II_DESC: "坤甸苏丹，西加里曼丹合作政权的元首。他是这个岛上唯一一个既是王、又是日本的人质的男人。\n\n1913 年生于坤甸，本名沙里夫·哈米德·阿尔卡德里。1942 年日本到来时他在爪哇，随即被拘押，一关三年。正因为他在爪哇，1944 年 6 月 28 日那一天他不在场：日本海军在坤甸处死了他的父亲苏丹沙里夫·穆罕默德·阿尔卡德里，同日斩首的还有他两名兄弟与家族中二十八名男性；西加里曼丹十二个苏丹国的苏丹被悉数处决，史称「十二贤」。他是全家唯一幸存的男丁——因为他在日本人的牢里。\n\n1945 年获释时，他继承的是一个没有贵族阶层的国家：日本为了铲除潜在的反对者，把整个马来上层连根拔了。空缺后来由达雅克人补上，而那批新精英只对丛林负责，不对王宫负责。他受过荷兰教育、会说多种语言、有行政能力——在我们的世界里，印尼国徽「潘查希拉之鹰」正是他设计的，他还当过西加里曼丹特区的元首，主张联邦制而不是单一制。\n\n1962 年他四十九岁，健康，有名望，有日本杀不掉的合法性，也有日本给得掉的王位。他支持联邦制——这恰好也是东京在群岛东部推的那套。日本需要一个坤甸人当合作者，而坤甸只剩他一个坤甸王族。"