### Syrian Impeachment ###
 IPN_ITA_SyriaImpeachment_desc: "尽管自1944年以来土耳其已经反复确认过其对叙利亚的控制，但这一控制仍在不可避免的下滑，尤其是其影响力始终过于依赖阿勒颇寡头集团及其代表，叙利亚人民党，更是加剧了现状的脆弱性。如今，随着叙镑在经济波动中飞速贬值，人民党对议会与执政联盟的控制突然松动，与阿勒颇对立的大马士革寡头集团及其代言人，也就是民族党，正向我们发出呼吁：只要协助他们击垮人民党自1949年以来的政治霸权，成功弹劾总统鲁什迪·基赫亚，叙利亚便会在意土之间更多倾向中立——乃至最终投入我方怀抱也未尝不可。"
 ITA_subsidize_national_party_radicals: "赞助民族党激进派"
 ITA_subsidize_national_party_radicals_desc: "民族党并非全部由反土耳其的坚定人士组成，而此次弹劾即使在党内也经历了诸多波折才得以推进。如今，我们务必要确保至少民族党本身不能发生更多分裂，使得其在和人民党的斗争中突然后方起火。"
 ITA_donation_to_damascus_oligarch: "对大马士革地区的产业投资"
 ITA_donation_to_damascus_oligarch_desc: "阿勒颇在传统上和地理层面便与土耳其联系紧密，我们极难插手，但大马士革则明显是另一幅景象。我们曾对大马士革进行过许多投资，而这也使得当地权贵集团受到我们的影响。如今，正是进一步扩大这些影响的绝佳时机。只有大马士革持续繁荣，民族党才能继续保留对阿勒颇人说不的意愿和能力。"

 IPN_TUR_SyriaImpeachment_desc: "我国于叙利亚的代言人，阿勒颇产业资本所推出的政治集团——也就是人民党，近期正在遭受严重挑战。由于叙镑贬值危机的持续发酵，人民党政府的民间与议会支持均迅速下滑，而大马士革商人们组建的老牌政党民族党则被妄图改变现状的激进分子把持，以期弹劾现任总统鲁什迪·基赫亚，终结人民党十余年的统治。由于叙利亚紧邻意属中东，直接派兵非常不可取，但与我们近期关系出现波折的前盟友意大利似乎正在叙利亚活动，而我方也不得不采取应对措施。"
 TUR_leverage_economic_influence: "施加经济影响力"
 TUR_leverage_economic_influence_desc: "随着阿勒颇的复兴与大马士革的衰落，我国如今在叙利亚的经济影响力日趋圆满——即使是相对反土的大马士革地区也由于意属中东与叙利亚之间的商道断绝而同样离不开土耳其商品的供给。因此，动用经济手段威胁大马士革、德拉、苏韦达等城市的经济稳定，便可提醒蠢蠢欲动的南方人。"
 TUR_increase_border_patrol: "扩充南境巡逻队"
 TUR_increase_border_patrol_desc: "我国在叙利亚的驻军由于三头同盟时期相对的内部缓和，因而多部署在北方乡间维持秩序与保护铁路等关键基础设施；但如今，部署惯性正使得相对空虚的叙利亚南方边界成为意大利人跨境资助叛徒的高速公路。将军队重新部署至南方，将能够打击这类偷渡行动，确保叙利亚政局在掌握之中。"
ITA_broadcast_propaganda_to_aleppo: "向阿勒颇放送反政府宣传"
ITA_broadcast_propaganda_to_aleppo_desc: "阿勒颇是人民党与土耳其的根基所在，当地产业资本对基赫亚政权的忠诚几乎牢不可破。然而叙镑贬值已使北方民众对本国政府的耐心降至冰点。通过意属中东的广播网络向阿勒颇及周边乡间持续放送揭露人民党贪腐与无能的宣传，我们未必能立刻撬动其政治立场，却足以在后方播下怀疑的种子，使土耳其人再难将叙利亚北方视作固若金汤的私产。"
ITA_arm_damascus_self_defense_groups: "武装大马士革自卫团体"
ITA_arm_damascus_self_defense_groups_desc: "大马士革的民族党人虽在议会中向基赫亚发难，但面对人民党掌控的警察与军警机器，单凭街头抗议难以为继。向与民族党结盟的地方自卫团体提供轻武器与训练，既能保护弹劾派组织者免遭构陷，也能在关键时刻以武力威慑阻挠对政府的强制庇护。枪杆子在手，南方的声音才不会被轻易噤声。"
ITA_pressure_kikhya_diplomatically: "对基赫亚展开外交施压"
ITA_pressure_kikhya_diplomatically_desc: "鲁什迪·基赫亚敢于无视大马士革的诉求，是因为他笃信土耳其的庇护牢不可破。通过我们在地中海与梵蒂冈的外交影响力，向这位总统暗示：若他继续以铁腕压制民族党、否决一切改革，意大利主导的欧洲舆论将不再视其为可对话的合法领袖，甚至可能转而扶持更顺从南方意志的替代人选。外交施压未必能立刻扳倒他，却足以让基赫亚在每一次签署镇压令时都多一分迟疑。"
TUR_fund_peoples_party_machine: "注资人民党选举机器"
TUR_fund_peoples_party_machine_desc: "人民党是我们经营叙利亚十余年的支柱，其组织网络与选举机器正是抵御民族党弹劾狂潮的堤坝。叙镑危机虽已侵蚀其民间声望，但只要机器仍在运转，议会中的席位便不会轻易流失。以经济援助与竞选资金为饵，为人民党补充其因贬值而枯竭的基层动员能力，使其能在南方城市守住阵地、在议会挫败每一次不信任动议——只要人民党不倒，基赫亚的总统宝座便稳如磐石。"
TUR_fortify_aleppo_railways: "加固阿勒颇铁路防线"
TUR_fortify_aleppo_railways_desc: "自三头同盟时期以来，我国驻军多分布于叙利亚北方乡间，以维持秩序、护卫连接阿勒颇与本土的铁路与关键基础设施，这恰是我国经济影响力得以笼罩北方的命脉。意大利人若想从内部瓦解我们的地位，暗中破坏铁路、制造北方供给断裂才是真正的杀招。增派工兵与卫戍部队加固沿线据点，确保这条生命线在任何风浪中都畅通无阻。"
TUR_run_intelligence_against_italy: "清剿意大利地下网络"
TUR_run_intelligence_against_italy_desc: "意大利人之所以能在大马士革呼风唤雨，靠的绝不仅是金钱，更是一张横跨叙土边境、专司偷运资金与煽动叛乱的地下网络。将情报与反间谍力量重新部署至叙利亚南方，锁定并肃清这些为民族党输送弹药的渠道，既能斩断对手的输血线，也能借机搜罗可用于要挟大马士革权贵的把柄。当意大利的暗手被一寸寸斩断，南方的躁动自会失去底气。"
ITA_BoP_category: "意大利—叙利亚博弈"
