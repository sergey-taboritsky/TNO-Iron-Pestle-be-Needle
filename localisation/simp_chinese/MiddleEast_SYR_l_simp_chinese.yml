 TNOIPN_SYR_party_4_text: "行动联盟党"
 TNOIPN_SYR_party_5_text: "人民党"
 TNOIPN_SYR_party_6_text: "民族党"
 TNOIPN_SYR_party_7_text: "叙利亚社会民族主义党"
 TNOIPN_SYR_party_8_text: "叙利亚穆斯林兄弟会"
 TNOIPN_SYR_party_9_text: "无党籍议员团"
 TNOIPN_SYR_party_10_text: "缺位"
 TNOIPN_SYR_party_1_desc: "叙利亚和黎巴嫩共产党"
 TNOIPN_SYR_party_2_desc: "阿拉伯复兴社会党"
 TNOIPN_SYR_party_3_desc: "社会主义合作党是议会中的温和左翼小党，由费萨尔·阿萨利创党并任主席，意识形态为社会民主与伊斯兰社会主义的杂糅，定位中左。它作为议会社会主义的代表，填补了被排除在议会之外的共产党与复兴党之间留下的左翼空白地带。\n\n党的社会基础集中于大马士革的城市中左阶层：既承接温和的福利与国家干预诉求，又因伊斯兰社会主义底色而与世俗左翼保持距离。在议会里，它是温和反对声音的提供者——既不像独立议员团那样纯粹逐利摇摆，也不像体制外左翼那样主张推翻秩序；当执政联盟就土地改革或国有化辩论时，社会主义合作党构成体制内左翼的质询者。然而，议会席位的过小规模导致该党更多是象征性的中间左翼存在而非决定性力量。"
 TNOIPN_SYR_party_4_desc: "行动联盟党是议会中的自由主义小党，也是老牌阿拉伯民族主义的符号。它由霍姆斯阿拉伯民族主义者阿卜杜勒·拉扎克·丹达奇于1932年创立，以反法国殖民、反教派主义为早期纲领；在如今的议会中站在自由主义立场，作为土耳其势力范围内一抹自由主义—阿拉伯民族主义的旧招牌，属体制外存在式的边际小党。\n\n党本身更像是历史符号而非活跃力量：丹达奇1935年即去世，其后继脉络稀薄，因此它不像人民党或民族党那样有扎实的当代权贵网络。在议会里，行动联盟党扮演自由派符号，为那些不满于权贵交易、又不愿投向左翼或教派势力的城市自由派选民提供一个名义归属；其议会党团通常并入自由派—独立阵营，对议事几无决定性影响，却在叙利亚的自主阿拉伯自由主义叙事上保留了一块活化石。"
 TNOIPN_SYR_party_5_desc: "人民党是议会第一大党，也是叙利亚共和国的执政轴心，代表阿勒颇为主、大马士革为辅的商人地主资产阶级的利益。它于1948年由阿勒颇实业家鲁什迪·基赫亚与纳齐姆·库德西共同创立，以阿勒颇为票仓、以库德西家族等望族为根基；此时正值扎伊姆军政府后期，土耳其正在计划恢复叙利亚的民主，正寻找满足保守、反共、有票仓的代理人。土耳其人恰好与人民党一拍即合，将其扶植为第三共和国执政党。\n\n党的权力核心可归为阿勒颇权贵集团：除共创人基赫亚与库德西外，还包括许多阿勒颇出身的学者、实业家、金融家。其意识形态底色为自由主义，经济上与土耳其深度绑定——这正符合阿勒颇城市的一般情况。"
 TNOIPN_SYR_party_6_desc: "民族党作为与人民党并肩的议会大党，正在无休止地与人民党构成大马士革-阿勒颇传统精英对峙：它根植大马士革老卫队，是独立于阿勒颇商帮的叙利亚民族主义老牌载体，与人民党既结盟又对抗。\n\n党的内部绝非铁板，而是沿对人民党态度裂为三个集团：温和派集团持亲自由市场立场，是执政联盟的亲政府一翼。党内\"左派\"专门在人民党—民族党联合政府里做桥接，同样亲政府。激进派倾向寡头制度、亲意大利而反人民党。\n\n党的人物谱系还包括前总统舒克里·库瓦特利、民族党主席法伊迪·阿塔西、元老法里斯·胡里等。民族党在议会中的角色多变：温和派构成执政多数的一部分，激进派则随时可被外部大国撬动，成为颠覆如今秩序的杠杆。"
 TNOIPN_SYR_party_7_desc: "叙利亚社会民族主义党"
 TNOIPN_SYR_party_8_desc: "叙利亚穆斯林兄弟会"
 TNOIPN_SYR_party_9_desc: "独立(Mustaqil)议员指不挂任何有组织的政党牌、以个人/家族/地域名义参选的当选者。主要可分为四类：地方名流靠家族势力和地域影响力当选，不代表任何党，但经济上属地主与资产阶级；部落与宗教社区头人，如德鲁兹、基督徒、阿拉维、库尔德的长老，常以独立身份或保留席进入议会；无党派但有资本与声望的大商人、实业家、城市专业人士；以及临时拼凑的\"选举联盟\"。\n\n他们是议会内毋庸置疑的造王者，组阁时各党靠收编独立派凑多数。此外，他们也是议会几个大党之间的缓冲层。"
 TNOIPN_SYR_party_10_desc: "因各种原因无法继续履行议员职责，造成该席位暂时空缺。按照一般流程，这一状态应当以最快的可能得到解决，无论是恢复议员职责还是进行补选。"

### Cabinet Advisors (开局内阁，由角色内联 advisor 块 + allowed={original_tag=SYR} 自动启用) ###
 SYR_Maarouf_al_Dawalibi_hog: "总理"
 SYR_Maarouf_al_Dawalibi_hog_desc: "马鲁夫·达瓦利比，人民党阿勒颇少壮派，1961年底起任叙利亚总理。在土耳其羽翼下主持开局政府，是阿勒颇商帮利益在内阁中的最高代表。"
 SYR_Abd_al_Rahman_al_Kayyali_stab: "众议院议长"
 SYR_Abd_al_Rahman_al_Kayyali_stab_desc: "阿卜杜勒·拉赫曼·卡亚利，人民党共同创始人、1961—62年众议院议长。维持议会日常秩序与执政多数纪律的关键人物。"
 SYR_Rashad_Barmada_interior: "内政部长"
 SYR_Rashad_Barmada_interior_desc: "拉沙德·巴尔马达，人民党阿勒颇人，1962年上半年接任内政部长。将警察与治安机器内化于人民党治下。"
 SYR_Khalid_al_Azm_econ: "财政部长"
 SYR_Khalid_al_Azm_econ_desc: "哈立德·阿兹姆，大马士革巨富、保守权贵，人民党政府的“钱袋子”与预算案实际执笔人，集中代表地主与工商业资本利益。"
 SYR_Abd_al_Hamid_al_Sarraj_sec: "安全(情报)部长"
 SYR_Abd_al_Hamid_al_Sarraj_sec_desc: "阿卜杜勒·哈米德·萨拉杰，纳赛尔派情报头子，掌管安全与情报机器。其亲纳赛尔立场在亲土的叙利亚政权内部构成一颗暗雷。"

### Vote Engine Test (测试用，无自动触发器) ###
 TNOIPN_vote_test.1.t: "法案表决引擎 · 测试台"
TNOIPN_vote_test.1.desc: "临时测试事件，用于手动验证通用法案表决引擎。\n选一项以把对应法案提交到议会议程；该法案会作为决议任务进入 21 天表决倒计时（在决议面板任务栏可见），倒计时结束时自动计票并弹出结果事件。\n\nA = 提交预算案（政府议程，普通多数71）\nB = 提交弹劾（高总统掌控，人民党未离心，民族党未决裂）\nC = 提交弹劾（低总统掌控，人民党离心，民族党决裂倒戈）\nD = 清除议程旗标（重置，便于重测）"
TNOIPN_vote_test.1.a: "提交预算案议程（普通多数71）"
TNOIPN_vote_test.1.b: "提交弹劾议程（高掌控/未决裂）"
TNOIPN_vote_test.1.c: "提交弹劾议程（低掌控/人民党离心）"
TNOIPN_vote_test.1.d: "清除议程旗标（重置重测）"
 TNOIPN_vote_test.2.t: "计票结果"
 TNOIPN_vote_test.2.desc: "总赞成：[Root.TNOIPN_vote_total_yes]  总反对：[Root.TNOIPN_vote_total_no]  门槛：[Root.TNOIPN_vote_threshold]  通过判定(1=过)：[Root.TNOIPN_vote_passed]\n\n各党 赞成/反对：\n人民党 SPP(46)：[Root.TNOIPN_vote_yes_SPP]/[Root.TNOIPN_vote_no_SPP]\n民族党 SNP(40)：[Root.TNOIPN_vote_yes_SNP]/[Root.TNOIPN_vote_no_SNP]\n社会主义合作党 SCP(4)：[Root.TNOIPN_vote_yes_SCP]/[Root.TNOIPN_vote_no_SCP]\n行动联盟 AUP(2)：[Root.TNOIPN_vote_yes_AUP]/[Root.TNOIPN_vote_no_AUP]\n社会民族主义党 SSNP(2)：[Root.TNOIPN_vote_yes_SSNP]/[Root.TNOIPN_vote_no_SSNP]\n无党籍(46)：[Root.TNOIPN_vote_yes_SYRNonPartisan]/[Root.TNOIPN_vote_no_SYRNonPartisan]"
 TNOIPN_vote_test.2.b: "关闭"

### 法案表决（决议层，仿法国议会机制） ###
 TNOIPN_budget_bill: "预算案（提交议会表决）"
 TNOIPN_budget_bill_desc: "政府预算案。需 [Root.TNOIPN_vote_threshold] 席普通多数通过。\n\n当前预计赞成 [Root.TNOIPN_vote_total_yes] 席、反对 [Root.TNOIPN_vote_total_no] 席（议会总席位 140）。\n\n主要阵营预计赞成：执政党 SPP [Root.TNOIPN_vote_yes_SPP]、人民党 SNP [Root.TNOIPN_vote_yes_SNP]、无党籍 [Root.TNOIPN_vote_yes_SYRNonPartisan]；反对派 SCP 仅 [Root.TNOIPN_vote_yes_SCP]。\n\n计算方式：各党按立场倾向（TNOIPN_vs_<党>）与党内纪律（TNOIPN_vd_<党>）折算赞成比例，乘以该党席位，累加得总赞成票；总赞成 ≥ 门槛即通过。\n\n本议程自激活起 21 天内完成表决。通过 +25 政治点、+0.02 稳定度；未过 -0.01 稳定度。"
 TNOIPN_impeachment_bill: "总统弹劾案（提交议会表决）"
 TNOIPN_impeachment_bill_desc: "反对派提出的总统弹劾案。需 [Root.TNOIPN_vote_threshold] 席超多数通过。\n\n当前预计赞成 [Root.TNOIPN_vote_total_yes] 席、反对 [Root.TNOIPN_vote_total_no] 席（议会总席位 140）。\n\n情景变量：总统掌控力 [Root.TNOIPN_president_grip]；社民党(SPP)离心 [Root.TNOIPN_SPP_disaffected]；人民党(SNP)决裂倒戈 [Root.TNOIPN_SNP_broke_with_president]。\n\n计算方式：反对派（SLCP/HBAI/SCP/AUP/SSNP/MBS）基线赞成；SPP 依总统掌控力与离心程度投票；SNP 依是否决裂倒戈；各党立场 × 纪律 × 席位累加。总赞成 ≥ 门槛则总统被弹劾下台。\n\n本议程自激活起 21 天内表决。"
TNOIPN_budget_bill_tt: "预算案计票预览：门槛 [Root.TNOIPN_vote_threshold] 席｜赞成 [Root.TNOIPN_vote_total_yes] / 反对 [Root.TNOIPN_vote_total_no]｜SPP [Root.TNOIPN_vote_yes_SPP]、SNP [Root.TNOIPN_vote_yes_SNP]、无党籍 [Root.TNOIPN_vote_yes_SYRNonPartisan]、SCP [Root.TNOIPN_vote_yes_SCP]"
TNOIPN_impeachment_bill_tt: "弹劾案计票预览：门槛 [Root.TNOIPN_vote_threshold] 席｜赞成 [Root.TNOIPN_vote_total_yes] / 反对 [Root.TNOIPN_vote_total_no]｜总统掌控力 [Root.TNOIPN_president_grip]｜SPP离心 [Root.TNOIPN_SPP_disaffected]｜SNP决裂 [Root.TNOIPN_SNP_broke_with_president]"
