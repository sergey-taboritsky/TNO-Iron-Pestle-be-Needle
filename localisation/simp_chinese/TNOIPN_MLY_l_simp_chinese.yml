## Country Info ##
 TNO_COUNTRY_INFO_BUTTON_TEXT_MLY: "民族与人民!"
 #101
 MLY_CountryInfo_Folder.101: "三百年往事"
 MLY_CountryInfo_Content.1: "四族汇流"
 MLY_CountryInfo_Content_desc.1: "印度尼西亚民族共和国的两块领土，苏门答腊与马来半岛，在1942年之前几乎从未被同一个政权统治，也没有共享过任何一套制度。它们是两块隔海相望的领土，四个互不继承的社会，但在1947年却在东京的精心设计下被装进同一个国家。\n\n首都棉兰尤其能够体现这种刻意设计制造而成的扭曲：它在19世纪末曾是日里苏丹国的首都，同时被荷兰人经营成烟草、橡胶、棕榈油的中心。现如今，马来人作为这座城市的原住民人口，集中于周边乡村；巴塔克移民从高原南下，占据城郊与部分军警职位；爪哇移民和难民多为种植园契约劳工的后代，数量极大；华人数量并不突出，但经济实力雄厚，是城镇商业、金融、走私的实际掌控者；只有如今的统治者、共和国的\"主人\"米南加保人作为少数族群，而且是最晚到的那一批，其下层在城内的生活相当尴尬。"
 MLY_CountryInfo_Content.2: "母系氏族"
 MLY_CountryInfo_Content_desc.2: "米南加保人是这个共和国最为关键的群体之一，却也是最为独特的——他们处于母系社会，土地由女性持有，传给女儿，而男子成年后只可离家谋生，大多成为商人。\n\n1821—1837年的帕德里战争重塑了这个民族。来自中东的瓦哈比派改革者试图清除当地的习俗法，结果被荷兰人利用来打垮米南加保的传统结构，战后习俗法与伊斯兰被强行缝合在一起。这直接造就了\"老派\"与\"新派\"的分野。前者坚持传统导师网络，后者受中东改革主义影响，主张清除非伊斯兰习俗——尤其是母系继承。印尼伊斯兰教师联合会PERTI，1930年创立于武吉丁宜郊区，便是老派的政治化产物；而1943年由日本设立的马斯友美是现代派的组织。这两个组织在同一个民族里，而且它们的分歧是教法层面的，不可调和。"
 MLY_CountryInfo_Content.3: "湖畔武士"
 MLY_CountryInfo_Content_desc.3: "苏门答腊北部高原，也就是多巴湖周边的巴塔克人，在荷属时期被两条完全不同的力量改造着。莱茵宣教会19世纪中叶起在苏门答腊北部传教，成效在群岛中最显著，并直接将巴塔克人塑造成了荷属东印度基督徒比例最高的大族群之一；荷印殖民军同样喜好从这种尚武且不倾向行政职位的族群募兵，巴塔克人是殖民军土著部队的重要兵源，进一步形成了军事职业的传统。\n\n日本在苏门答腊组建义勇军与\"兵补\"时，优先把枪交给基督徒比例高的巴塔克青年，进一步强化了这个民族作为兵源的身份。如今，苏门答腊唯一有完整指挥链的人群是巴塔克人。正如共和国的公民们私下常说的那样，米南加保人掌笔，巴塔克人掌枪。"
 MLY_CountryInfo_Content.4: "无君之冠"
 MLY_CountryInfo_Content_desc.4: "1873—1904年的亚齐战争是荷兰耗时三十年、代价最惨的一场殖民战争，亚齐是荷属东印度毋庸置疑最后被征服的大区，并且从未真正被驯服。尽管其末代苏丹在1903年投降、1939年死于流放，但亚齐独立的政治架构仍然没有被磨灭。随着贵族的失败，宗教力量承担起了重建亚齐基层组织网络的重任，而他们相当成功：全亚齐乌里玛联合会于1939年由达乌德·贝鲁埃等人重组，并逐渐建立了一套平行于荷兰行政的宗教教师网络：清真寺、宗教学校、宗教税、教法裁决......一切事物均可在乌里玛独立处理，而殖民政府对此无可奈何。\n\n在如今的共和国时期，亚齐已经实现了地方酋长完全退出政治，这正是因为亚齐是荷属东印度唯一一个在独立前就完成了内部革命的地区。"
 MLY_CountryInfo_Content.5: "千岛锁钥"
 MLY_CountryInfo_Content_desc.5: "马来半岛是四个社会里唯一一个由苏丹和外来劳工构成的复合体。九个马来邦除柔佛外，绝大部分在19世纪末将行政实权交给英国顾问。与此同时，19—20世纪华人的大规模迁入，撑起了锡矿、橡胶园、转口贸易与城镇商业，也造就了槟城、怡保、吉隆坡、新山等华人城市。此外，橡胶园的泰米尔裔劳工构成了半岛的第三个人群。\n\n更为复杂的是，17世纪末起的米南加保移民带来了母系制的痕迹；1773年四大酋长渡海回苏门答腊请来新君，其统治者称号是\"被人民举为大者\"，不是苏丹，也没有神授王权，甚至可被四大酋长选举、罢免。"
 #102
 MLY_CountryInfo_Folder.102: "东印度的最后时刻"
 MLY_CountryInfo_Content.6: "殖民地统计学"
 MLY_CountryInfo_Content_desc.6: "二战前荷属东印度的识字率总体极低(可能不到两位数)，但分布极不均匀，而差异恰好沿着民族线。西苏门答腊在殖民统计中长期处于群岛前列，原因是母系氏族愿意集资送男孩上学，背后是女耕男商经济对记账、契约、书信的大量需求；相对地，爪哇的识字资源集中于高等荷兰语学校，培养的是爪哇精英而非文书层。\n\n橡胶产业坐落于马来半岛和苏门答腊东岸，1929年后长饱受期萧条和国际橡胶管制协议困扰。邦加勿里洞、勿里洞、廖内群岛、霹雳的锡矿早已存在世界性的管制协议，巨港的石油更是整个荷属东印度战役的核心目标。然而，苏门答腊与半岛的种植园带不产足够的米。 殖民时代的解法是缅甸与暹罗的进口。1930年代的萧条与管制，是1947年后走私经济的技术前提。当合法配额无法维持营生时，绕过配额就成了常识。"
 MLY_CountryInfo_Content.7: "民族主义三代"
 MLY_CountryInfo_Content_desc.7: "第一代民族主义者诞生于1927年，五个民族主义组织组成印尼民族政治团体协商会，成为印度尼西亚第一个跨党派的统一战线组织。与此同时，1928年共产主义起义失败，运动组织者被捕或流放。第二代则在1930年代的运动分裂出了三种完全不同的答案：苏托莫医生渐进、务实、温和的民族主义主张举办工会与合作事业，萨托莫和谢里夫丁激进反法西斯、主张议会与民族统一阵线，而马来青年同盟更注重反对封建主义，要求现代民族国家和彻底的共和国。所有人在1930年代都在谈\"大印度尼西亚\"，但没有人的大印度尼西亚是同一个形状。第三代则源于战争前夜的印尼政治联盟，随着自治请求遭到否决，印尼民族主义者与荷兰当局正式走到了无法妥协的程度。"
 MLY_CountryInfo_Content.8: "抉择时刻"
 MLY_CountryInfo_Content_desc.8: "1941年12月日本跨过克拉地峡，本地民族主义者没有一个中立，大部分人在开战那天就站到了日本一边。接受日本资助，与占领军合作，乃至进入民政体系，日本的入场正式让印尼民族主义团体嗅到了独立的契机。藤原机关在1942年同时联络亚齐、马来青年联盟、半岛苏丹和印尼民族主义者，为所有人开出了不同的价码。\n\n一些组织立刻品尝到了与虎谋皮的恶果。1942年中，马来青年联盟遭到日本取缔；1943年亚齐转向反日，被日军大肆清洗。当然，米南加保人和爪哇人此时正在心甘情愿地同日本合作。日本在整个群岛征调的劳务挺身队规模在数十万到数百万之间，其中苏门答腊劳工被大量派往苏门答腊的铁路与机场，加里曼丹的油田与码头，爪哇的工地以及群岛东部的项目，至今这一工作仍在被共和国延续。"
 MLY_CountryInfo_Content.9: "三所学府"
 MLY_CountryInfo_Content_desc.9: "日本在群岛办了三所\"学校\"，毕业生后来构成了这个国家的统治阶级。宣伝部是笔杆子的学校，教宣传技术、行政文书、审查、组织群众大会，毕业后掌握行政机关，成为如今米南加保文官集团。国父亚明便是宣伝部高级官员。义勇军是枪杆子的学校，马来义勇军、巴塔克军官团和印尼义勇军全部出于此，其成员如今已经成为复员军人组织和各种青年团的话事人。印尼独立养正塾是\"反贼\"的学校，丹马六甲遇害后印尼共产党的重建这迪帕·艾地便出身于此。沙里尔当时便料到，这所学校的真正目的是培养渗透分子进入共产主义与亲共产主义的地下组织，把他们分化成亲斯大林派和民族主义的共产主义派。它的校友遍布努山塔拉邦联各邦国的行政机关，而它的出资人是日本海军。"

 #103
 MLY_CountryInfo_Folder.103: "立国方略"
 MLY_CountryInfo_Content.10: "建国原点"
 MLY_CountryInfo_Content_desc.10: "早在1944年10月，日本总理小矶国昭便许诺过印尼独立。1945年8月17日凌晨，苏加诺、哈达、苏巴佐在前田精少将家中起草独立宣言，当日上午宣读。然而按照日本在南洋的既定方针，爪哇不能交给任何单一本地政权，因此独立宣言遭到的回应是长达十一个月的冷落。1946年7月3日，日本宪兵在南洋清剿拒绝合作派网络，丹马六甲被秘密处决，死讯封存，印尼民族主义失去了它的反西反日第三阵营。\n\n穆罕默德·亚明也在被捕行列中，但几个月后被单独释放，并被带去谈判——他手里只有1939年的国民印尼团名册，而它换来了建国许可。1947年印度尼西亚民族共和国成立，首都定在棉兰：苏加诺被排除在体制之外，至今仍居住在贾加鲁塔；爪哇被切成贾加鲁塔、日惹苏丹国与西爪哇伊斯兰国，与共和国一同装进1949年的努山塔拉邦联。群岛再一次平静了下来......"
 MLY_CountryInfo_Content.11: "国体手术刀"
 MLY_CountryInfo_Content_desc.11: "1947年的这套安排由东京核准：亚齐被确定为教法自治区，特库·哈桑入党，组建半独立的亚齐防卫军，以安抚贝鲁埃和乌里玛。在马来半岛，苏丹被降为州元首，实权移交给中央任命的州务大臣；没有苏丹可降的槟城与马六甲由中央直接接管，两地华人商会因此拿到别处没有的谈判地位。在苏门答腊，德里、雪当、廖内-林加、占碑、巨港、英德拉吉里全部废除，土地收归国有，只有两个例外：柔佛保留御林军与独立土地登记制，森美兰延续四大酋长选王制。随着爪哇的拆分，一批不愿在神权国也不愿在苏丹国服役的巽他与爪哇正规军在1947—48年渡巽他海峡西撤，番号保留为西利旺吉师，至今仍是全军最好的部队。1953年贝鲁埃叛乱，尝试加入万隆，亚齐防卫军随之分裂；1955年双方接受日本斡旋停火，贝鲁埃转入山林，亚齐民政交回党内，宗教法庭照常开庭。"
 MLY_CountryInfo_Content.12: "最后一届选举"
 MLY_CountryInfo_Content_desc.12: "1955年9月29日，共和国举行了唯一一次大选，执政党和军队席位加在一起只有120席，而反对阵营刚好也是120席——其中近六十席属于马斯友美一家。打破僵局的重任落到了氏族长老会与华人商会的十七票。这次投票明显指出，米南加保的统治撑不过第二次选举。随后，军队和总统以"收复国土非常时期"为名义冻结了选举，第一次成为最后一次。\n\n之后的五年中，群岛间形成了走私贸易的灰色循环，印度和德国叩响了共和国的大门，而1957年前马来青年联盟的激进派分离出去组建了马来人民党，进一步削弱了执政党的力量。1960年底，总统开始生病，其医生阿德南·卡保·加尼认定国父撑不过1962年。如今，这一消息已经通过未知渠道流传甚广，各党各派都在为此摩拳擦掌。"
 MLY_CountryInfo_Content.13: "经济与社会"
 MLY_CountryInfo_Content_desc.13: "自1950年起，日本加紧对印尼的经济开发，并通过保护条款和制度化的劳务队盘剥国家资源与人力。与此同时，哈达的技术官僚五年建成了合作社系统，国有资本掌握能源与航运，并维持对日谈判。1955年后，稻米—橡胶剪刀差、共荣圈抽水、海峡灰色循环三种经济逐渐成型，昭南—横滨、孟加拉湾、巽他海峡、加里曼丹、圣诞岛—澳洲五条路线各有分工：官价通道换工业品，孟加拉湾通印度与德国，海峡与加里曼丹是走私两翼，圣诞岛—澳洲几乎不设税卡。而所有出海货物都要先在昭南特别市过一道税关——共和国最大的贸易伙伴，同时也是它的海关。\n\n与此同时，米南加保文官和巴塔克军官的共同体持续统治着这个国家，半岛马来人在存在压制华人的需求基础上不断进行着妥协。媒体和文化产业仍在接受宣伝部系后代管理，唯一不受审查的是印度共和国的短波和走私进来的新闻纸。"

 #104
 MLY_CountryInfo_Folder.104: "党内派系全传"
 MLY_CountryInfo_Content.14: "执笔者"
 MLY_CountryInfo_Content_desc.14: "印度尼西亚团结党诞生于1939年，亚明因路线分歧被谢里夫丁从印尼人民运动中开除后建立该党作为个人政治工具。国民印尼团名册是他唯一的筹码，也是他如今身边最紧密的团体。他们1943年起掌握行政机关的内政、税收、审查，如今不要更多东西，只要在亚明死前定下能确保其权力延续的国家方略。党内第二号人物是亚齐的特库·穆罕默德·哈桑——亚齐靠他才被缝进执政党，他要的只有教法自治区的续期。\n\n十州行政班是1942—45年第25军民政班底与宣伝部系的联盟，掌握行政机关、警察、税收、审查，是米南加保文官集团的具象化。它的两张面孔是阿瓦卢丁·贾明与马希丁：前者三十五岁做到国家警察首脑，掌户籍、审查与国安会第五席；后者出身半岛马来青年联盟军事翼，代表半岛马来人在镇压机器里的位置。他们除了留任外别无诉求。"
 MLY_CountryInfo_Content.15: "侍立者"
 MLY_CountryInfo_Content_desc.15: "合作社运动是哈达的技术官僚小圈子，延续1931年新民族党的干部教育与精英主义路线，核心除哈达外还有财政系统的夏弗鲁丁与总统的医生阿德南·卡保·加尼。通过控制1950—54年建成的合作社系统，他们掌握着唯一一套既不依赖国家财政也不依赖军队的经济网络。哈达本人还通过祖父继承了纳克什班迪教团的领袖地位——与塔比亚传道会的阿尔-拉苏利同出一源，派系构成相当复杂。\n\n马来人的政治势力源自马来青年联盟和随后的半岛印尼人运动，领袖是雅各布与穆斯塔法·侯赛因，诉求是彻底肃清残存的君主制。然而它的合法性来自一座苏门答腊岛上的异域城市，而它要废除苏丹，等于同时向自己土地上的传统权威宣战。此外，最为激进的马来民族主义者已在马来人民党的分离中脱离体制，并放弃了印尼民族主义——共和国对他们而言已经是敌人。"
 MLY_CountryInfo_Content.16: "反对者"
 MLY_CountryInfo_Content_desc.16: "翁·惹化和阿都拉萨控制着半岛苏丹被日本改成国家官员之后从苏丹身上剥下来的那部分权威，掌握土地、马来官僚与马来教师网络，并凭借柔佛御林军的实际影响力左右各州的州务大臣任命。在保住马来人地位一事上他们与马来青年联盟暗合，但两者因后者的反封建倾向和前者的保守主义底色而成为死敌。1962年1月19日翁·惹化病逝，这面旗由阿都拉萨还是胡先·翁接过去，至今无人敢问。\n\n塔比亚传道会，也就是伊斯兰教师联合会，是1930年创立的米南加保老派政教组织，如今控制宗教学校网络并主导教法裁决，还有传统的母系制背书。它在亚齐的分支——穆达·瓦利的人民醒悟团——是站在政府一侧作战的，这也是当局肯把宗教法庭的牌照发下去的原因。尽管其领导层年迈，但仍然尝试维护不被马斯友美吃掉的教法空间。"
 MLY_CountryInfo_Content.17: "持戈者"
 MLY_CountryInfo_Content_desc.17: "国民军主要分为两派。占主导的巴塔克军官团一直希望军队彻底统一，但统一的契机只能是战争，周围却不存在这样的对象。军队的用途主要是对内的：镇压亚齐、压制华人。纳苏蒂安管陆军，塔希尔管海峡防务与监视——走私命脉在他手里。\n\n西利旺吉流亡者在巽他人乌马尔·维拉哈迪库苏马与爪哇人苏布罗托领导下规模更小却更精锐，诉求是打回爪哇、消灭万隆与日惹，但这些尝试全遭日本严斥。加托主张军队首先是"领土重建者"：师部兼管民政与地方税，用借来的土地换回爪哇。1962年6月11日他在任上去世，这支军队将由巽他人乌马尔决定是接着做梦还是埋掉。\n\n此外，萨利赫的前义勇军与穆尔巴青年团掌控街头与复员军人组织。他的立场取决于谁坐棉兰那把椅子：文官集团还在，他就是最好的执行者；换成军人或亚齐势力，他立刻变成最难缠的反对派。另有两支不听调的武装：亚齐防卫军与柔佛御林军。"
