 MLY_Yamin: "穆罕默德·亚明"
 MLY_Yamin_DESC: "印度尼西亚民族共和国总统，米南加保人，1903 年生于西苏门答腊沙哇伦多矿区。\n\n1927 年获莱顿大学法学博士学位。他是「印度尼西亚」这个词的提出者，是 1928 年青年誓言的起草人之一，也是国歌《伟大的印度尼西亚》的词作者。1939 年他因路线之争被 Gerindo 开除，转而另组印度尼西亚团结党（Parpindo）——这个党此后一直是他个人的工具，而不是一台有群众的机器。\n\n日占时期他在昭南宣伝部系统任职，与哈达、夏弗鲁丁同属「用笔换实利」的一批人。1946 年 7 月 3 日，日本把一屋子民族主义领袖抓了起来，最后只放了他一个：不是因为他的纲领更对，而是因为只有他能被安放在一份已经拟好的干部名单的最上面。1947 年建国时他出任总统，签下的是一部只对两块土地有效的宪法。\n\n他统治的方式不是命令，而是仲裁——让米南加保的笔、巴塔克的枪和半岛的土地互相需要，并且都更需要他。1962 年，这三样东西都还在，他却快要不在了。"
 MLY_Natsir: "穆罕默德·纳席尔"
 MLY_Natsir_DESC: "马斯友美党主席，米南加保人，1908 年生于西苏门答腊阿拉汉班让，早年在高地的伊斯兰学院受教育，通晓阿拉伯语。\n\n他是这个国家里最后一个能同时用宗教与宪法说话的人：一方面握着 1955 年那次大选中五分之一的选票，另一方面又拒绝退出体制——他要的不是推翻共和国，而是在宪法之内把它改造成伊斯兰国家。\n\n他的难题不在爪哇，而在脚下。马斯友美公开敌视母系制，认为它违背伊斯兰继承法；可米南加保的母系制正是这个国家的骨架，而他自己就是米南加保人。所以他争的从来不是总统那把椅子，而是条文、继承法与宗教法庭的管辖权。\n\n1962 年，西爪哇的达鲁伊斯兰国与亚齐的贝鲁埃一南一北都在等他表态；他不说，而这份沉默本身就是共和国最贵的东西。"
 MLY_Hamka: "哈姆卡"
 MLY_Hamka_DESC: "米南加保乌理玛、改革主义思想家，Muhammadiyah 与《万子》的奠基者之一。\n\n哈姆卡是阿布杜拉赫曼·哈姆扎之子，后者是印尼国民教育与成童年运动的推动者。哈姆卡以散文与杂文蜚声印尼文坛，被视为最杰出的穆斯林现代主义者之一。\n\n他既反对伊斯兰国教化，也反对把西方世俗主义照搬进印尼，主张\"中间道路\"。其作品在马来与苏门答腊拥有广泛读者，是 RSM 党内\"宗教改革派\"的精神象征。\n\n在架空线中，哈姆卡是纳席尔最有力的思想盟友：两人共同构成 RSM 体制内温和而坚定的伊斯兰现代主义轴心，既反对左翼的激进世俗化，也反对 DMS 的神权化。"
 MLY_Sjahrir: "苏坦·沙里尔"
 MLY_Sjahrir_DESC: "印尼社会主义党创始人，宪政派，1909 年生于西苏门答腊巴东班让的米南加保家庭，留学荷兰。\n\n日占时期他拒绝与占领当局合作，隐居不出——这让他成了共和国里唯一一个手是干净的人，也让他成了唯一一个没有班底的人。1946 年 7 月日本抓捕民族主义领袖时他不在名单上，因为日本人知道他本来就什么都不会签；1947 年建国时他也不在名单上，因为建国这件事本身就是签出来的。\n\n他主张宪政分权、地方自治与军队国家化，反对一党专断。他的党在 1955 年那次也是唯一一次大选中拿到过选票，此后选举被冻结，他成了一个没有选可投的反对派领袖。\n\n他真正掌握的不是选票，而是一句话：这个国家的合法性来自 1945 年那份宣言，而不是 1947 年那份协定。这句话他随时可以说，而一旦说出，整个执政党的法统就要重新算账——正因如此，他被允许存在，也被允许清谈，仅此而已。"
 MLY_Hatta: "穆罕默德·哈达"
 MLY_Hatta_DESC: "经济学家、国家元老，\"对日合作换实利\"的推动者。\n\n哈达是米南加保 cooperative movement（合作运动）的理论奠基人之一，也是印尼合作社运动的先驱。1930年代他在阿姆斯特丹的经济学训练使他成为当时最能读懂国际经济的一批人之一。\n\n1945年后他出任联合政府财政部长，主持国有银行体系与经济政策的重建。\n\n在架空线中，哈达是 RSM 体制内最清醒的\"现实派\"：他不纠结于\"印尼统一\"这类已不可能实现的宏愿，转而专注于把苏门答腊—马来亚的残缺国家经营好。他主张以务实外交与日本谈判、以合作社经济对抗垄断，是\"技术官僚派\"的核心。"
 MLY_Syafruddin_Prawiranegara: "夏弗鲁丁·普拉维拉内加拉"
 MLY_Syafruddin_Prawiranegara_DESC: "技术官僚派操盘手，主掌财政与经济。\n\n夏弗鲁丁是印尼独立时期的重要经济官员，长期在财政部与中央银行任职。\n\n在架空线中，他代表 RSM 体制内\"技术官僚派\"的实务灵魂，与哈达的经济路线一脉相承。他比哈达更偏重制度建设，主张以国有资本掌握能源与航运命脉，并推动半岛马来经济与苏门答腊资源经济的整合。"
 MLY_Teuku_Muhammad_Hasan: "特库·穆罕默德·哈桑"
 MLY_Teuku_Muhammad_Hasan_DESC: "亚齐裔，亚齐与苏门答腊伊斯兰—地方主义利益的代表。\n\n图穆罕默德·哈桑是亚齐著名乌理玛与政治家，亚齐的伊斯兰现代主义与地方自治运动的重要人物。\n\n在架空线中，他代表 RSM 体制内的亚齐力量：既是虔诚的穆斯林，也是强硬的亚齐地方主义者。他对雅明—纳席尔的\"雅加达式\"世俗路线心存疑虑，主张以苏门答腊的地方宗教认同为立国之本。"
 MLY_Daud_Beureueh: "达乌德·贝鲁埃"
 MLY_Daud_Beureueh_DESC: "亚齐乌理玛联合会（PUSA）创始人，亚齐宗教权威，建国妥协里最脆的一环。\n\n贝鲁埃 1899 年生于亚齐，1939 年创建 PUSA，把亚齐的乌理玛网络织成了一个能动员的组织。日本人在 1942 年选中 PUSA 作为统治亚齐的合作对象——这是 F 机关三个月内定下的几张票之一，也是此后二十年亚齐血债的起点。\n\n1947 年建国时，亚齐是三块拼图里最勉强的一块：它既不米南加保，也不半岛马来，而是靠一份宗教自治承诺被缝进来的。此后十五年，棉兰每一次试图把国家机器伸进亚齐，都会撞上这位老人。\n\n1953 年他宣布亚齐归属卡托苏维约的印度尼西亚伊斯兰国，1955 年出任其副伊玛目——西爪哇的达鲁伊斯兰国在海峡对岸，亚齐在共和国北端，两端一旦同时发难，棉兰的军队就只能二选一。他在开局的身份不是叛乱者，而是仍在体制内的定时炸弹：真正的问题是引爆他的会是谁，以及那一天棉兰还有没有第二个亚明。"
 MLY_Tan_Malaka: "陈马六甲"
 MLY_Tan_Malaka_DESC: "左翼派的精神源头——也是一个死人。1946 年日本宪兵清剿南洋拒绝派网络时他被捕，1947 年建国前后被秘密处决。\n\n陈马六甲（Tan Malaka）1897 年生于西苏门答腊苏利基，米南加保人，与亚明、哈达、纳席尔、哈姆卡同出一块土地。他是荷属东印度最彻底的「百分百独立派」，拒绝一切低于完全独立的方案——正因为他是米南加保人，他才是东京最无法收买的对象：一个米南加保人随时可以指着棉兰那把椅子说，那是刺刀抬上去的。死讯被封存，官方只承认「极端分子在羁押期间死亡」。\n\n在架空线中他已死，而死掉的他比活着的更有用：地下左翼奉他为殉道者，米南加保青年里始终有人认为共和国欠着这笔血债；他的「第三阵营」因失去核心而瓦解——一批本该由他统领的青年干部散入体制，最终变成没有纲领、只认成效的技术官僚。"
 MLY_Nasution: "阿卜杜勒·哈里斯·纳苏蒂安"
 MLY_Nasution_DESC: "武装部队司令，巴塔克穆斯林，1918 年生于苏门答腊塔帕努里的哥打诺潘。\n\n日本人在苏门答腊招募义勇军兵补时，刻意把枪交给了基督徒与传统信仰占比都很高的巴塔克青年；纳苏蒂安是那批人里最会学习的一个。他以纵深防御的战法成名，也在 1945 年之后成为苏门答腊唯一一支拥有完整训练与指挥链的武装力量的组织者。\n\n共和国的承重墙是这样的：米南加保人掌握笔与财政，巴塔克人掌握枪。纳苏蒂安站在这堵墙的右半边，因此在亚明之下、在所有人之上——他能约束文官政府，也能在必要时成为军事政变的推手。\n\n1962 年他真正的难题不是权位，而是这支军队本身有两副面孔：武吉巴里桑各旅要守住这个只有两块土地的国家，而西利旺吉师要拿它换回爪哇。想让军队统一，唯一的办法是选一场仗来打；而他一旦选了，军队就会沿着这道裂缝裂开。"
 MLY_Simatupang: "塔希·波纳尔·西马图潘"
 MLY_Simatupang_DESC: "巴塔克基督徒，总参谋长，以\"专业化、去党派化\"平衡各方。\n\n西马图潘1912年生于苏门答腊的哥打礼让，与纳苏蒂安同乡，同样出身巴塔克精英家庭。\n\n他以稳健著称，战间与战后长期担任印尼军队总参谋长，主张军队\"超党派、专业化\"，反对军人干政。\n\n在架空线中，西马图潘是 RSM 体制内的\"平衡器\"：他既是纳苏蒂安的同乡与制衡者，又主张军队不介入政党政治。其\"去党派化\"立场使他在雅明—军方与左翼之间游走，是体制中最有信誉的技术型军人。"
 MLY_Achmad_Tahir: "艾哈迈德·塔希尔"
 MLY_Achmad_Tahir_DESC: "北苏门答腊出身，海军转陆军军官，主掌马六甲海峡防务。\n\n塔希尔生于苏门答腊北岸的亚齐附近，早年加入皇家海军，后转入陆军。\n\n他以战术素养与对马六甲海峡水道的熟悉著称。\n\n在架空线中，塔希尔是 RSM 海军—陆战队系统的代表，掌握马六甲海峡的防御与监视——这是 RSM 立国之本的经济命脉。他既是雅明的军方支点，也在关系未来马六甲海峡利益分配上具有不可忽视的发言权。"
 MLY_Ibrahim_bin_Yaacob: "易卜拉欣·本·雅各布"
 MLY_Ibrahim_bin_Yaacob_DESC: "半岛马来激进派旗手，马来青年同盟（KMM）的创建者，半岛事务部长。\n\n易卜拉欣·本·雅各布 1911 年生于彭亨州淡马鲁附近的峇都卡蒋，纯马来农家出身，丹绒马林苏丹伊德里斯师范学院毕业后任教，1938 年转入报界并创建 KMM。他是第一个把「独立」当作可以公开索要的东西提出来的人——1942 年 2 月，日军南进途中，他向进占吉隆坡的部队递交了一份要求独立的备忘录；日本用了他的组织，没有给他答案。\n\n1947 年分治时，半岛马来人得到的不是国家，而是「压制华人」这一条写进建国的义务，以及国家机器里分给他们的那一半。雅各布就是这个安排的受益者兼人质：他当上半岛事务部长，代价是他的激进履历从此归政府所有。宫廷系看不起他，米南加保集团用他，日本记得他 1942 年那张纸。\n\n他在 1962 年的作用不是治理，而是名分——如果有一天有人要撕毁米南加保与半岛马来之间那份不成文的契约，能让它听起来像是在完成 1942 年那次请求的人，只有他。"
 MLY_Mustapha_Hussain: "穆斯塔法·侯赛因"
 MLY_Mustapha_Hussain_DESC: "马来青年同盟（KMM）首任主席，半岛事务部首位部长，雅各布的政治导师。\n\n穆斯塔法·侯赛因生于吉打州，是 1940 年代马来民族主义政治的老将，在《马来亚人的抉择》等著作中系统阐述了马来人的政治自觉与民族权利。\n\n在架空线中，侯赛因代表半岛马来民族主义的稳健路线：以争取马来人的文化与政治权利为起点，主张在新的国家框架内实现马来人的主体地位。他与雅各布的青年运动路线一激进一稳健，共同构成建国的半岛马来政治骨架——也正是这两条路线的互斥，让米南加保人有了充当仲裁者的余地。"
