l_simp_chinese:
 state_lore_initials.70: " DMA "
 state_lore_name.70: "大马士革"
 state_lore_desc.70: "大马士革依巴拉达河而生，卧在反黎巴嫩山脉的脚下，守着戈兰外侧的绿洲沃土。作为倭马亚清真大寺的所在地、阿拉伯帝国第一个全盛王朝的龙兴之地，它自古被称作\"东方之珠\"。在法国委任统治与叙利亚独立的政治版图上，大马士革更是无可争议的权力中枢：内阁、议会、宗教权威与旧贵族尽数盘踞于此，城中的哈米迪耶市集与直街曾是全国财富与门第的象征。数百年来，\"叙利亚\"在很大程度上就是大马士革及其名流的同义词。\n\n然而天不遂人意，当叙利亚的国家轴线因土耳其合作而向北倾斜，大马士革第一次尝到了被绕过的滋味。安卡拉的青睐与资本尽数倾注于紧贴边境的北方，阿勒颇成了新秩序的宠儿；而深居南方内陆、远离新贸易轴的大马士革，不再是资源与注意力流向的终点。曾经以都城为中心编织的恩庇网络，随着北方的兴起而一寸寸松弛。\n\n旧日穿城而过的商流如今改道阿勒颇：哈米迪耶市集的店铺门可罗雀，直街上叫卖的不再是四方来客，而是为本城居民勉强支撑的老字号；戈兰绿洲的农业盈余找到了更便宜的北方出口，不再非经首都集散。国家财政的倾斜使南方基建停滞，城中膨胀却经费不足的官僚机构吞噬着有限的税收。大马士革的手艺人与小职员阶层在停滞中老去，这座城仍保有政治与文化之心的名号，却已不再驱动国家的经济脉搏。\n\n大马士革的名门——那些世代入阁、把持宗教与土地的大族——眼睁睁看着自己的分量北移东散。他们仍占据着部长席位与寺院讲坛，却越来越像旧秩序的活化石；真正的筹码已转移到北方商会与安卡拉的会客厅里。首都成了一座象征大于实权的城市，它的咖啡馆与沙龙里仍高谈阔论，只是话题与国家治理再无关系。\n\n今日的大马士革是一名优雅而迟滞的迟暮贵妇：倭马亚清真大寺的镶嵌依然璀璨，戈兰的果园依旧飘香，城墙内的宫殿与官邸依旧排场十足；但城市的活力正以北迁的速度流失。昔日的东方之珠静候着——它不确定这个新向北而生的秩序，最终会不会回过头来，重新为她加冕。"

 state_lore_initials.71: " HLB "
 state_lore_name.71: "阿勒颇"
 state_lore_desc.71: "阿勒颇雄踞于叙利亚西北高地，扼守安纳托利亚高原与黎凡特海岸之间的商队咽喉。在奥斯曼的漫长世纪里，它是帝国境内仅次于伊斯坦布尔与开罗的巨型市集——巴格达铁路与跨安纳托利亚商道在此交汇，城内商栈堆满了来自小亚细亚的丝麻、陶器与铜器，再将黎凡特的橄榄油、肥皂与棉布转运北上。然而二十世纪初期国界被强行重划之后，阿勒颇被一刀切断了它赖以存活的安纳托利亚腹地，昔日吞吐万商的喉咙骤然闭锁；在法国委任统治与独立后的岁月里，它退化为一个被大马士革光芒遮蔽的北方旧城，商栈尘封，铁路锈蚀，曾经最具有国际视野的阿勒颇商帮也随之黯淡。\n\n峰回路转，叙利亚与北方强邻土耳其结成深度合作。这一转向对阿勒颇而言无异于命运的回归——封锁了数十年的边境重新敞开，跨安纳托利亚走廊随土耳其资本与工程师一同复活，安卡拉的铁路与公路网沿着古老的商道向南延伸，刚好落在阿勒颇的城门下。曾经衰败的商栈再度填满来自小亚细亚的货箱，土耳其里拉与叙镑在城中的钱庄并行流通，土耳其建筑队开进城堡区，将战后残破的石墙重新砌起。\n\n阿勒颇借此重登\"叙利亚商业首府\"的宝座。它成了南北贸易轴的北端枢纽：安纳托利亚的工业品经此转口南下，黎凡特的农产品与阿勒颇传统的月桂肥皂、橄榄油、丝棉织品则由此北销。自由贸易的氛围吸引了土耳其承包商与银行设点，城市的吞吐量在短短数年间反超南部都城。阿勒颇的纺织作坊、肥皂工坊与铜器匠铺重新满负荷运转，古老的手工业行会迎来了百年未见的订单旺季。\n\n与此同时，失语了半个世纪的阿勒颇商帮——那些历史上最精明、最通达的家族——找回了他们天生的角色：充当大马士革与安卡拉之间的中间人。一个松散利益集团在城中成形，它不再满足于只做买卖，而开始向北方的政策制定者输送意见，同时牵起人民党的缰绳统御南方。城内的亚美尼亚、库尔德与阿拉伯手工业街区也因繁荣而重新拥挤，阿勒颇又一次成了叙利亚最具世界主义气质的城市。\n\n今日的阿勒颇是一座向北张望、信心复燃的城市。城堡的灯火重新照亮夜空，商栈的叫卖声压过了宣礼塔的回响。它清楚地知道自己正站在新时代的门槛上——而南方的故都，已被它悄然甩在身后。"