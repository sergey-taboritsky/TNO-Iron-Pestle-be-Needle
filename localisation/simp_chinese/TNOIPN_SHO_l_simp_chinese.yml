## Characters ##
 SHO_Lim_Tianbao: "吕天保"
 SHO_Lim_Tianbao_DESC: "昭南岛华侨协会理事长，奉纳金勒索的实际操盘者。\n\n战时他是昭南岛华侨协会的核心——日方文献明载此人是\"原本已亲日者\"，协会的实际运作由他主持，而非挂名的会长林文庆。\n\n1942年3月，他出任奉纳金筹委会主任，召集新马十一州华侨领袖协商分摊总额五千万叻币的勒索款：新加坡与雪兰莪各一千万、霹雳八百五十万、槟榔屿七百万、马六甲五百五十万、柔佛五百万、森美兰二百万、彭亨五十万、吉兰丹三十万、丁加奴二十万。\n\n全马最终仅筹得二千八百万，余款向横滨正金银行以年息六分借款补足，昭南岛实付一千二百五十万。\n\n战后他继续留在中华总商会体系内，任战时副会长陈六使属下。\n\n在架空线中，他于1962年被任命为昭南特别市市长。对日本而言，他是资历最老、最可信赖的亲日华人面孔；对华人而言，他是亲手把五千万从他们身上搜刮出来的技术责任人——这座城市欠他的，正是他当年从这座城市拿走的。"
 SHO_Tan_Yeok_Seong: "陈育崧"
 SHO_Tan_Yeok_Seong_DESC: "南洋史学家，昭南岛华侨协会秘书，日据勒索的第一手记录者。\n\n1903年生于槟城，祖籍福建海澄。少年入集美中学，后考入厦门大学商科，1926年毕业后南洋，历任华校督学。1935年创办南洋书局，出版\"马来亚化\"教科书，业务日后扩展至槟城、吉隆坡、仰光、马六甲与巴达维亚。\n\n1938年因鼓动华侨青年参与抗日运动与殖民当局意见相左而辞职，专心从事出版与南洋史研究。\n\n日占期间，他出任昭南岛华侨协会秘书，亲历了日方勒索的全过程并完整记录。战后，他于1946年9月在《南洋学报》发表英文长文《五千万元奉纳金勒索始末》，将日本军政府如何逐州摊派、如何以开枪威胁、以正金银行放贷补足缺口的全过程公之于世——这是昭南华人社会战后清算日占的第一份系统性文献。\n\n1964年，他将一万册南洋研究藏书捐赠新加坡国家图书馆，该批藏书后成\"椰阴馆\"，至今仍是东南亚史研究的核心资料。\n\n在架空线中，他于1962年被任命为昭南特别市市长。他的双重身份是昭南政治的关键：战时他是亲日体制的参与者与记录者，战后他又是揭发这套体制的作者。日本需要他这样一张面孔——既能安抚华人，又能把当年的罪行解释成\"行政失误\"而非暴行。"
