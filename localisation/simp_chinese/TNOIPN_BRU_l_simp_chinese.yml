## Ideas ##
 TNOIPN_SHO_ninteenth_army_support: "第三十七军的支援"
 TNOIPN_SHO_ninteenth_army_support_desc: "为了稳住北婆罗洲的局势，东京方面指定第三十七军北上支援，当地的军政机器这才勉强维持住运转。\n\n§R然而第三十七军的调动意味着其在婆罗洲其余地区的兵力被同时抽空，倘若这些地区出现新的冲突，南洋日军将面临两难抉择。§!"
 TNOIPN_SHO_defenses_emptied: "防御空虚"
 TNOIPN_SHO_defenses_emptied_desc: "原本驻扎此地的第三十七军已被调走，如今砂拉越、文莱与北婆罗洲的防御只能依赖当地民兵与土著武装。这些部队不但战斗力值得怀疑，忠诚度同样不能高估。§R若局势拖延过长，北婆罗洲的动荡随时可能演变为与文莱相似规模的全面失控。§!"
