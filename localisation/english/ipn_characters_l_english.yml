	MLY_Yamin_DESC:0 "RSM 首任总统，米南加保裔知识分子、诗人、法学家，革命文人正统，日本有条件独立框架下的国家元首。"
	MLY_Agus_Salim_DESC:0 "RSM 首席外交顾问，米南加保裔伊斯兰现代主义旗手、外交家，负责对日交涉与争取阿拉伯世界承认。"
	MLY_Natsir_DESC:0 "Masyumi 主席，米南加保—伊斯兰双重身份，亚明争取宗教阵营的关键纽带，兼跨建国庆派与伊斯兰派。"
	MLY_Hamka_DESC:0 "米南加保乌理玛、改革主义思想家，Muhammadiyah 与 Masyumi 要员，负责意识形态与宗教文宣。"
	MLY_Sjahrir_DESC:0 "PSI 创始人，温和社会主义者，建国庆派中的自由派/社会民主一端，左翼派的精神近邻。"
	MLY_Hatta_DESC:0 "经济学家、国家元老，党内最清醒的『对日合作换实利』推手，任总理或首席经济顾问。"
	MLY_Syafruddin_Prawiranegara_DESC:0 "技术官僚派操盘手，主掌财政与央行，在『对日资源供给』与『本国财政自主』间走钢丝。"
	MLY_Teuku_Muhammad_Hasan_DESC:0 "亚齐裔，亚齐与苏门答腊伊斯兰—地方势力总代表，宗教事务部长级『苏门答腊事务总监』。"
	MLY_Daud_Beureueh_DESC:0 "亚齐 PUSA 创始人，达鲁伊斯兰领袖，RSM 内最强的离心伊斯兰势力，若中央世俗化过度便起事。"
	MLY_Tan_Malaka_DESC:0 "左翼派的精神源头与理论旗号，激进共产主义者、革命家，社会革命/土改/反封建皆溯及于他。"
	MLY_Aidit_DESC:0 "PKI 主席，生于棉兰外港 Belawan，左翼派在首都圈与华人劳工中的组织核心，亚明欲借且须防。"
	MLY_Shamsiah_Fakeh_DESC:0 "马来裔女民族主义者，AWAS 创始人、马共成员，左翼派在半岛工农与女性群体中的旗帜。"
	MLY_Abdullah_CD_DESC:0 "马来裔共产主义者，KMM 创始成员，马共第 10 regiment 指挥官，半岛左翼工农武装与跨族群动员者。"
	MLY_Nasution_DESC:0 "巴塔克穆斯林，武装部队司令，首都棉兰所在北苏门答腊军区实际掌控者，总统对日协作与镇压力量执行人。"
	MLY_Simatupang_DESC:0 "巴塔克基督徒，总参谋长，以『专业化、去党派化』平衡各派，军队派中的技术—宪政一翼。"
	MLY_Achmad_Tahir_DESC:0 "北苏门答腊出身，海军转陆军军官，主掌马六甲海峡防务与海军，负责对日海军协作与航运安保。"
	MLY_Ibrahim_bin_Yaacob_DESC:0 "半岛马来青年派旗手，KMM 创始人，『大印尼』思想旗手，RSM 半岛并入的关键推手。"
	MLY_Mustapha_Hussain_DESC:0 "KMM 首任副主席，半岛事务部长，Yaacob 系在半岛西岸城市集群的组织骨干。"
	MLY_Rashid_Maidin_DESC:0 "马来裔共产主义者，左翼派的『谈判—统战』角色，负责与保守马来势力及华人左翼协调。"
	DMS_Kartosuwiryo:0 "S.M. Kartosuwiryo"
	DMS_Kartosuwiryo_DESC:0 "达鲁伊斯兰（Darul Islam）领袖，OTL 1949 年在西爪哇宣布建立伊斯兰国并自任伊玛目，主张以伊斯兰法统一全印尼。在架空线里为 DMS（西爪哇）的最高权威与意识形态核心，RSM 的死敌，宣称 RSM 是『叛教者的世俗政权』。"
	DMS_Amir_Fatah:0 "Amir Fatah"
	DMS_Amir_Fatah_DESC:0 "达鲁伊斯兰西爪哇战地司令，OTL 曾领导西爪哇 DI 游击。在架空线里作为 DMS 的野战指挥官，负责反 RSM 的圣战前线，是 DMS 的武力支柱之一。"
