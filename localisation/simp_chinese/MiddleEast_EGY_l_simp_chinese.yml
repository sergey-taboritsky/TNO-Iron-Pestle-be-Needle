### Events ###
 IPN_EGY_news.1.t: "[Get_newspaper_header]阿卜杜勒·哈迪帕夏政府辞职"
 IPN_EGY_news.1.desc: "尽管埃及现政府并非出自与君权冲突颇多的华夫脱党，但政坛元老易卜拉欣·阿卜杜勒·哈迪帕夏的首相任期仍伴随着不断加剧的君臣冲突。近日，有传言称法鲁克国王与首相在闭门会议中不欢而散，而今日这一消息也许被证实了——首相及其政府已经集体宣布辞职。\n\n由于联合自由党仍然把持着议会的相对多数，下一任首相将在党内选出，而目前来看，阿卜杜勒·哈迪帕夏的继任者应当是前萨阿德主义制度党出身的温和派技术官僚努雷丁·塔拉夫。他已经宣布将带领新一届政府领导埃及直至一年后的议会选举。埃及的宗主国意大利方面对此并未发表任何评价。"
 IPN_EGY_news.1.a: "法鲁克国王与议会的裂痕仍在扩大。"
 IPN_EGY_news.2.t: "[Get_newspaper_header]华夫脱党赢得埃及议会选举"
 IPN_EGY_news.2.desc: "随着1963年议会选举的结果最终揭晓，华夫脱党作为一匹黑马成功夺取过半席位，即将单独组阁。在选举前，联合自由党始终未能解决其内部的严重分歧，这被认为是其应对选举迟缓、内部裂痕严重且拉票手段拙劣的根本原因。随后，如今的联合自由党党魁、盲眼诗人塔哈·侯赛因宣布辞职，预计该党将会陷入又一轮内部冲突，使得华夫脱党的新政府暂时能够在议会中不受阻挠地施政。\n\n尽管并不十分满意，但在罗马方面传信后法鲁克国王仍宣布福阿德·希拉吉丁帕夏将被任命为首相。新政府预计将很快上任。"
 IPN_EGY_news.2.a: "他们会重蹈纳哈斯帕夏的覆辙吗？"
 IPN_EGY_news.3.t: "[Get_newspaper_header]联合自由党赢得埃及议会选举"
 IPN_EGY_news.3.desc: "随着1963年议会选举的结果最终揭晓，看起来联合自由党成功阻击了华夫脱党来势汹汹的猛烈攻势，守住了其执政联盟的相对多数。作为相对亲宫廷的技术官僚领导人，党魁奥斯曼·艾哈迈德·奥斯曼已经被任命为埃及的下一任首相。\n\n华夫脱党已经为他们的又一次败选表达了遗憾，据悉，其内部的青年一代正在对党魁希拉吉丁施加更多压力。除该党之外，埃及国内正在向政权巩固的方向前进。"
 IPN_EGY_news.3.a: "看来埃及人始终无法放下对革命的恐惧。"
 IPN_EGY_news.4.t: "[Get_newspaper_header]联合自由党赢得埃及议会选举"
 IPN_EGY_news.4.desc: "随着1963年议会选举的结果最终揭晓，看起来联合自由党成功阻击了华夫脱党来势汹汹的猛烈攻势，守住了其执政联盟的相对多数。然而，如今领导联合自由党的却是被认为与华夫脱党相差无几的前立宪自由党自由主义学者，党内元老阿里·阿卜杜勒·拉齐克。在某些埃及人口中，如今的联合自由党和华夫脱党一样，是企图动摇君权和意大利控制的激进派。\n\n国王似乎并未受到此类传言影响，已经宣布将任命拉齐克为新的首相。与此同时，华夫脱党在选举中又一次铩羽而归，其内部的青年一代似乎正在对党的领导层表达不满。"
 IPN_EGY_news.4.a: "他的道路是否刚刚失败过一次？"
