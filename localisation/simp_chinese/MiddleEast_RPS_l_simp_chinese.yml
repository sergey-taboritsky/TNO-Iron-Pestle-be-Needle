### National Spirits ###
 RPS_governor_general_naguib: "总督：穆罕默德·纳吉布"
 RPS_governor_general_naguib_desc: "穆罕默德·纳吉布是埃及军队高级将领中少见的知识分子。他曾于1918年进入埃及皇家军事学院，两年后毕业并在军中任职，但与同样出身行伍的其他军官不同，他又在1927年考入福阿德一世大学进修法律兼学政治经济学，获得法学博士学位。随后，他又于1939年毕业于开罗指挥与参谋学院。马希尔政权倒台时，正值意埃联军尝试平定第二次马赫迪叛乱的关键时刻，而纳吉布恰好在前线担任旅长。由于其发掘出了军队前线物资涉及国王本人的贪腐丑闻，并化名\"一个士兵\"将其揭露，其民望大涨，但也成为埃及体制的眼中钉肉中刺。\n\n在自由军官组织飞速扩张时，纳吉布因为与几个宪政派政党关系密切而相当反感贾迈勒·纳赛尔之流的亲德与民族社会主义倾向，但这并没有阻止1954年政变流产后开罗诸公以怀疑的眼光将其调离——以\"最合适的总督人选\"之名，体面外放至苏丹，出任埃及属苏丹总督。名义上自然不惜溢美之词，包括但不限于需要苏丹裔名将镇守苏丹，或者是褒奖反马赫迪战争的英雄......如今，这一任命已经生效数年，纳吉布也只得在喀土穆的总督官邸中消磨时光。当然，他仍与苏丹本地的亲埃及宪政派力量和开罗本身的各个政党存在联系，而且无人知晓他是否存在超出如今任命的其他意图。"

 RPS_mirghani_and_mahdi: "米尔加尼与马赫迪"
 RPS_mirghani_and_mahdi_desc: "苏丹政治的根基不是政党，而是两条苏菲教团的血脉。哈特米亚教团由大米尔加尼于十九世纪创立，盘踞东苏丹卡萨拉一带，自土耳其—埃及统治时代起便与开罗结盟、换取特权与庇护，是苏丹最亲埃的宗教—地方势力；安萨尔（马赫迪派）则源于穆罕默德·艾哈迈德·马赫迪，他于一八八一年自命为马赫迪，掀起圣战于一八八五年攻破喀土穆、击毙戈登，缔造了存续十三年的马赫迪国家，直至恩图曼之战败于基奇纳。英埃共管时期，哈特米亚是受宠的亲政府教团，马赫迪家族（由其子阿卜杜勒·拉赫曼承继）则聚拢苏丹民族主义与反埃情绪，孵化出乌玛党。\n\n在本时间线埃及将苏丹吞并为自治领之后，这两条血脉的站位被进一步固化：米尔加尼一系（今为阿里·米尔加尼）成为开罗在东方最可靠的支柱，马赫迪—安萨尔一系（阿卜杜勒·拉赫曼及其子萨迪克）则因世代反埃的血仇而成为收编的主要障碍，且已失去英国这一昔日护盾。一切政党、派系与地区的站位，最终都绕不开这条裂隙——它是苏丹政治的语法本身。一旦这道均势被撼动，协作与抵抗的整幅版图都将被重新书写。"
 RPS_nile_valley_unity: "尼罗河谷统一"
 RPS_nile_valley_unity_desc: "尼罗河谷统一——瓦赫达特·瓦迪·尼尔——是埃及与苏丹同属一躯、共饮一河的信念。它生于二十世纪初的苏丹毕业生与埃及民族主义者之间，至四十年代成为伊斯梅尔·阿兹哈里麾下民族统一党的旗帜，主张英人的分而治之人为割裂了河谷两岸。历史上，无论埃及君主还是后来的纳赛尔都坚持“统一或虚无”，当苏丹于一九五六年选择独立时，开罗起初拒绝承认。\n\n而在本时间线，这句口号已不再是口号，而是既成事实：埃及将整条河谷吞入怀中，“统一”由阿兹哈里鼓吹的理念变成了自治领的法律与行政现实。但其代价也随之暴露：对马赫迪阵营、对南方、对每一个曾将统一想象为伙伴而非臣属的苏丹人而言，这个词已发酵为吞并的委婉语。曾经缝合两岸的标语，如今反倒成了割裂的刀痕。开罗究竟还能让“自愿统一”的虚构遮掩征服的现实多久，正是悬在喀土穆头顶的疑问。"
 RPS_agrarian_economy: "农业经济"
 RPS_agrarian_economy_desc: "苏丹是一个农夫的国度。绝大多数国民依锄与犁为生，散布在粘土平原与河流阶地之间，与工业、金融几乎无缘。共管当局将这片土地狭薄的繁荣建立在外销农业之上——棉花、阿拉伯胶、芝麻、高粱与都尔拉沿尼罗河而下，或从苏丹港装船出海。一小撮商业阶层贴着青、白尼罗河的岸线聚集，真正的工业资产阶级几近于无。一年的节律，便是洪水与收获的节律。\n\n作为埃及的自治领，这一农业基底既是政权财富的源泉，也是其野心的天花板：开罗自苏丹土壤抽取棉花与岁入，却鲜少有动力去工业化一块臣属之地。占人口绝大多数的农民，政治上沉寂却举足轻重，是被管理而非被动员的对象。一个如此依赖单一季风敏感作物与单一宗主的经济，基础本就脆弱；一场坏洪水或一笔被扣下的贷款，便足以动摇整片乡村对自治领的忠诚——而自治领的存续，正建筑在这片乡村之上。"
 RPS_gezira_cotton: "杰济拉棉田"
 RPS_gezira_cotton_desc: "在青、白尼罗河之间，喀土穆以南，躺着杰济拉——“岛屿”——一片广袤的黑色龟裂粘土三角，其灌溉工程于一九二〇年代在共管当局治下铺开，先由苏丹种植园辛迪加、后由国有机构经营。青尼罗河上的森纳尔水坝供水，使之成为地球上最大的集中农业计划之一，数以十万计的佃农被政府与辛迪加、农户的三方契约缚定于棉花一作物。它所产的长绒棉，既筑起了苏丹港的栈桥，也喂饱了伦敦的纱厂。\n\n对埃及行政当局而言，杰济拉是自治领的皇冠明珠，也是它的收银机——其棉花支撑着总督府、驻军与维系附庸的 patronage。数十万佃农家庭是一个被管理、被规训的群体，其命运随曼彻斯特与亚历山大港的棉价起落。谁掌控了杰济拉的水，谁便掌控了苏丹；青尼罗河的一场干旱，或三角地带的一次佃农罢工，都将直击埃及统治的神经中枢。"
 RPS_neglect_south: "忽视南方"
 RPS_neglect_south_desc: "在苏德沼泽以南的赤道诸省，信奉基督教与万物有灵、语言习俗属于非洲的南方人，对阿拉伯—伊斯兰的北方素来陌生。共管年间，他们被一套单独的“南方政策”治理：封闭区、传教士学校，以及与喀土穆刻意的割裂。待北方于一九五六年继承国家，便将南方当作被征服的边陲统治：学校稀少、职位匮乏、开发近乎为零，只增驻军以压服。一九五五年托里特兵变，是第一道裂痕。\n\n在埃及自治领之下，南方的边缘化若说有变，也是更深：开罗的目光死死盯住尼罗河核心与棉花三角，南方前线被听之任之，成了遭忽视而非被投资的地带。正从这种遗忘之中，滋生出南方阵线与阿尼亚尼亚的种子——本杰明·洛沃基那一代人所代表的反抗前驱。中心的漠视本身即是一项政策，而南方怨恨的静默累积，是一根慢燃的导火索；自治领耽溺于河谷，尚未开始正视一场它迟早要面对的冲突。"

