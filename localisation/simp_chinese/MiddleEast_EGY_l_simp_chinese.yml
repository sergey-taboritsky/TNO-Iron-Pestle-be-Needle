### Characters (New) ###
 EGY_Taha_Hussein: "塔哈·侯赛因"
 EGY_Taha_Hussein_DESC: "埃及20世纪最具影响力的作家与思想家之一，人称『盲眼诗人』。早年失明却以惊人毅力完成学业，成为现代阿拉伯文学与人文学科的奠基者。政治上属自由宪政派，曾任联合自由党(ULP)党魁，在君主制框架下主张宪政与教育改革。其声望使其一度被视为可担纲组阁的技术型自由派领袖。"
 EGY_Muhammad_Haidar: "穆罕默德·海达尔帕夏"
 EGY_Muhammad_Haidar_DESC: "埃及陆军将领，曾任战争部长，皇家埃及陆军的代表人物之一。作为职业军人，他在王室与军方之间充当桥梁，是君主制秩序下维系军队忠诚的关键人物。被任命为安全部长，主理王国内政与防务安全。"

### Political Advisors ###
 EGY_Ali_Abd_al_Raziq_hog: "阿里·阿卜杜勒·拉齐克"
 EGY_Ali_Abd_al_Raziq_hog_desc: "§Y埃及王国议会议长\n联合自由党\n自由主义学者§!\n--------------\n§L联合自由党元老、伊斯兰现代派学者。作为王国议会议长(政府首脑)，在君主立宪框架下协调议会与宫廷，是温和宪政派的核心人物。§!"
 EGY_Osman_Ahmed_Osman_eco: "奥斯曼·艾哈迈德·奥斯曼"
 EGY_Osman_Ahmed_Osman_eco_desc: "§Y经济部长\n联合自由党\n建设巨头§!\n--------------\n§L著名工程与建筑巨头，联合自由党技术官僚派代表。入阁主理经济事务，以市场化与大型基建推动埃及现代化。§!"
 EGY_Taha_Hussein_for: "塔哈·侯赛因"
 EGY_Taha_Hussein_for_desc: "§Y外交部长\n联合自由党\n自由主义学者§!\n--------------\n§L盲眼诗人、自由宪政派思想家，联合自由党党魁。出任外交部长，以文人声望与宪政立场代表埃及处理对外事务。§!"
 EGY_Muhammad_Haidar_sec: "穆罕默德·海达尔帕夏"
 EGY_Muhammad_Haidar_sec_desc: "§Y安全部长\n皇家埃及陆军\n职业军人§!\n--------------\n§L埃及陆军将领、前战争部长。作为军方代表出任安全部长，主理内政与防务安全，是王室维系军队忠诚的支柱。§!"