### Characters ###
 RPS_Mohamed_Naguib: "穆罕默德·纳吉布"
 RPS_Mohamed_Naguib_DESC: "生于喀土穆、母为苏丹人的埃及陆军将领。本时间线1952–54自由军官革命未成、纳赛尔政变流产，纳吉布从未登埃及总统位。作为支持宪政、反对君主专制的潜在威胁，他被以『最合适的总督人选』之名体面外放，出任埃及属苏丹总督——表面是主动启用，内核是软性外放。"
 RPS_Ismail_al_Azhari: "伊斯梅尔·阿兹哈里"
 RPS_Ismail_al_Azhari_DESC: "苏丹民族统一党(NUP)领袖、亲埃统一派首席世俗旗手。从毕业生代表大会秘书到1945年创立阿什格党、1952年扩组为民族统一党，其『尼罗河谷统一』主张在埃及成功吞并苏丹后兑现，成为埃及在苏丹的执政载体。"
 RPS_Ali_al_Mirghani: "阿里·米尔加尼"
 RPS_Ali_al_Mirghani_DESC: "哈特米亚(Khatmiyya)苏菲教团领袖，基地在东苏丹卡萨拉——苏丹最亲埃的地区。历史上与奥斯曼—埃及政权合作，视埃及为庇护者，与反埃的马赫迪家族(安萨尔)为宿敌。是埃及在苏丹的宗教—地方支柱。"
 RPS_Abd_al_Rahman_al_Mahdi: "阿卜杜勒·拉赫曼·马赫迪"
 RPS_Abd_al_Rahman_al_Mahdi_DESC: "马赫迪之子、安萨尔精神领袖、苏丹最富有权势的本土人物。马赫迪家族与埃及有血仇(1885年其祖击败埃及驻军)，天然疑埃、主张独立。本时间线失去英国庇护，是埃及收编的主要障碍但实力受损。(1885–1959)"
 RPS_Muhammad_Ahmad_Mahjub: "穆罕默德·艾哈迈德·马赫朱卜"
 RPS_Muhammad_Ahmad_Mahjub_DESC: "乌玛党实际政治领袖、潜在总理人选。承安萨尔臂膀，反埃独立、保地主与宗教秩序。与年轻萨迪克·马赫迪共领乌玛党的政、灵两线。"
 RPS_Abd_Allah_Khalil: "阿卜杜拉·哈利勒"
 RPS_Abd_Allah_Khalil_DESC: "乌玛党元老、前军官、军政背景。乌玛党早期骨干，与马赫朱卜共同挂帅反埃保守阵营。"
 RPS_Ibrahim_Ahmad: "易卜拉欣·艾哈迈德"
 RPS_Ibrahim_Ahmad_DESC: "民族统一党(NUP)要员、苏丹自治领首任议会议长。出身毕业生大会(GGC)，是亲埃统一派在议会中的组织核心，负责维系喀土穆本地政府与开罗的政治衔接。"
 RPS_Abdel_Khaliq_Mahjub: "阿卜杜勒·哈利克·马赫朱卜"
 RPS_Abdel_Khaliq_Mahjub_DESC: "苏丹共产党(SCP)总书记、左翼反吞并旗手。源自1944年白旗联盟，1946年改组为共产党，奉马克思列宁主义，组织依托苏丹工会联合会(SWTU)。"
 RPS_Mahmoud_Mohammed_Taha: "马哈茂德·穆罕默德·塔哈"
 RPS_Mahmoud_Mohammed_Taha_DESC: "宪政兄弟会领袖、伊斯兰现代主义改革者。主张以理性重读古兰、改革伊斯兰，在君主制框架下持君主立宪自由派立场，于1940年代属边缘小党，如今入阁主理经济事务。"
 RPS_Jaafar_Nimeiry: "贾法尔·尼迈里"
 RPS_Jaafar_Nimeiry_DESC: "纳赛尔主义青年军官。本时间线纳赛尔1954年被流放、埃及成君主制—意大利监护秩序，故其奉持的『纳赛尔主义』与现秩序正面冲突，是潜伏的反君主制/反监护革命种子，与纳吉布构成『立宪元老 vs 革命少壮』的苏丹对照。"
 RPS_Sadiq_al_Mahdi: "萨迪克·马赫迪"
 RPS_Sadiq_al_Mahdi_DESC: "年轻一代安萨尔精神领袖，承其父阿卜杜勒·拉赫曼·马赫迪1959年死后的 mantle。更伊斯兰民粹、动员草根，与保守地主派的老乌玛党形成张力。"
 RPS_Benjamin_Lwoki: "本杰明·洛沃基"
 RPS_Benjamin_Lwoki_DESC: "南方在议会的代表、南方党(自由党)领袖之一。代表南方利益，后演变为南方阵线(Southern Front)，是远期安亚尼亚(Anya Nya)的政治前驱。"
 RPS_Mirghani_Hamza: "米尔加尼·哈姆扎"
 RPS_Mirghani_Hamza_DESC: "人民民主党(PDP)领袖。1956年自民族统一党(NUP)裂出，仍属哈特米亚(米尔加尼)阵营、亲埃底色但转为『苏丹优先』，是阿兹哈里在亲埃统一派内的潜在对手。"

### Political Advisors ###
 RPS_Ibrahim_Ahmad_hog: "易卜拉欣·艾哈迈德"
 RPS_Ibrahim_Ahmad_hog_desc: "§Y苏丹自治领议会议长\n民族统一党\n社会自由主义§!\n--------------\n§L苏丹议会议长、NUP要员，作为自治领的『二把手』协调议会与政府，维系喀土穆与开罗的政治衔接。§!"
 RPS_Mirghani_Hamza_for: "米尔加尼·哈姆扎"
 RPS_Mirghani_Hamza_for_desc: "§Y苏丹驻开罗全权代表\n人民民主党\n进步主义§!\n--------------\n§L人民民主党(PDP)领袖，主管外交事务。亲埃底色但转向『苏丹优先』，负责维系与开罗的微妙平衡。§!"
 RPS_Ibrahim_Abboud_sec: "易卜拉欣·阿巴乌德"
 RPS_Ibrahim_Abboud_sec_desc: "§Y苏丹国防军司令\n苏丹武装部队\n职业军队§!\n--------------\n§L苏丹国防军(SDF)司令，埃及在苏丹的军事支柱。主管安全事务，是开罗维系对喀土穆控制的关键保证。§!"
 RPS_Mahmoud_Mohammed_Taha_eco: "马哈茂德·穆罕默德·塔哈"
 RPS_Mahmoud_Mohammed_Taha_eco_desc: "§Y经济部长\n宪政兄弟会\n改革者§!\n--------------\n§L伊斯兰现代主义改革者，君主制下的君主立宪自由派。入阁主理经济事务，主张以理性与现代化路径发展苏丹农业与财政。§!"

### Concepts ###
 RPS_dominion_status: "埃及属苏丹"
 RPS_dominion_status_desc: "1948年埃意谅解后，苏丹正式并入埃及框架，以自治领(dominion)形式存续——名义上保留本地政府(NUP执政)，实质为埃及王国直辖属土。"
 RPS_mirghani_mahdi_rivalry: "米尔加尼—马赫迪对立"
 RPS_mirghani_mahdi_rivalry_desc: "苏丹政治的根本裂隙：哈特米亚(Mirghani,亲埃)与安萨尔(Mahdi,反埃)两大苏菲教团的历史对立，贯穿一切势力站位。"
