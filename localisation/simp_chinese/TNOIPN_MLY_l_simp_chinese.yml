 MLY_Gatot_Subroto: "加托·苏布罗托"
 MLY_Gatot_Subroto_DESC: "加托·苏布罗托（1907—1962），中爪哇人，国民军副总参谋长。他一生主张军队首先是“领土重建者”——师部兼管民政、修路与地方税，这套领土战理论本是为在爪哇重建国家秩序而写的。\n\n西利旺吉师渡海西撤后，他随军来到棉兰，发现自己手里没有爪哇可以重建，只有海峡对岸这两块借来的土地。他不想要它们，他要的是用完它们。\n\n1962年6月他在任上去世，西利旺吉师由巽他人乌马尔·维拉哈迪库苏马接掌——由一个巽他人来决定这个爪哇人的梦是接着做下去，还是埋掉。"
 SRB_Woerjaningrat: "伍尔亚宁格拉特"
 SRB_Susanto_Tirtoprodjo: "苏桑托·蒂尔托普罗佐"
 SRB_Iskaq_Tjokrohadisurjo: "伊斯哈克·佐克罗哈迪苏尔约"
 SRB_Woerjaningrat_DESC: "大印度尼西亚党（Parindra）元老，梭罗贵族出身，战前「合作派」民族主义的老面孔。1947 年分治后留驻爪哇，成为日惹苏丹国文官集团的门面——他的作用不是决策，而是让一套日本扶植起来的政权看起来仍带着战前民族主义的正统性。生年不详，1962 年已届耄耋。"
 SRB_Susanto_Tirtoprodjo_DESC: "梭罗出生的法学家，日本设立的独立准备调查会（BPUPK）成员，历任司法部长、代理总理，1950—1952 年任小巽他总督。分治后主持日惹苏丹国的司法与内政重建，以「程序合法性」为日本留下的行政框架加冕；他也是 SRB 与努山塔拉邦联各邦国打交道的法理专家。"
 SRB_Iskaq_Tjokrohadisurjo_DESC: "印尼民族党共同创始人（1927 年与苏加诺并列），莱顿法学出身，日占时期任万由马士助理知事与中央参议会议员，1946 年任梭罗知事时被共产党人绑架。他既与苏加诺同辈、又与占领当局合作过，因此是日惹苏丹国最资深也最有争议的文官首脑——爪哇旧 PNI 系的活遗产，且在 1950 年代的经济部长任上留下过贪腐案底。"
