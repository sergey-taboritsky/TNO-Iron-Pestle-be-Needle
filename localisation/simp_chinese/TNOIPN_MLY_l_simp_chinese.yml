 MLY_Yamin: "穆罕默德·亚明"
 MLY_Yamin_DESC: "米南加保出身，1899年生于棉兰，是米南加保民族主义与革命文艺的奠基人之一。\n\n亚明早年受传统马来宫廷教育，后赴荷兰接受高等教育，1928年取得莱顿大学文学博士学位。归国后他以诗歌与散文唤醒米南加保青年，被视为\"民族之魂\"。\n\n1942年日军入侵后，亚明以《马来民族》报为阵地 号召抗日，并亲赴各邦组织动员。1945年印尼宣布独立，他出任印尼民族党主席与联合政府总理，是印尼建国最关键的谈判者之一。\n\n在架空线中，亚明以"米南加保—半岛马来青年"的跨岛联盟为基础，在日本的"有条件独立"框架下建立共和国。他既是文人革命家，也是务实的国家奠基者：主张以文化认同巩固苏门答腊的分裂国家，同时以技术官僚治理经济。晚年，他被视为"残缺的印尼"最清醒的守护者。"
 MLY_Agus_Salim: "哈吉·阿古斯·萨利姆"
 MLY_Agus_Salim_DESC: "米南加保人，宗教现代主义先驱。\n\n萨利姆生于棉兰，青年时代游学中东与埃及，深受伊斯兰现代主义思潮影响。归国后他创办\"安达卢亚\"（Andalusia）杂志与阿萨德清真寺，将伊斯兰复兴与政治改革相结合，成为 Masyumi 运动的奠基人之一。\n\n二战期间他活跃于抗日地下组织，1946年后出任联合政府外交部长。\n\n在架空线中，萨利姆是 RSM 的首席外交顾问，主张以\"对日合作换取实利\"：只要日本承认苏门答腊—马来亚的民族国家地位与宗教自治，他不惜与之周旋。其人温和而坚定，是 RSM 平衡日本与伊斯兰世界的关键棋子。"
 MLY_Natsir: "穆罕默德·纳希尔"
 MLY_Natsir_DESC: "Masyumi 主席，米南加保—伊斯兰双重身份。\n\n纳希尔生于苏门答腊高原的米南加保贵族家庭，早年在德里的伊斯兰学院受教育，通晓爪哇语与阿拉伯语。\n\n他被视为\"南苏门答腊最后一个能同时用宗教与政治说话的人\"：一方面以 Masyumi 主席身份争取穆斯林选票与教派合法性，另一方面在政治上反对苏加诺式的世俗民族主义，主张宪法保障与伊斯兰法的共存。\n\n在架空线中，纳希尔是 RSM 体制内最有威望的宗教权威，也是\"世俗建国 vs 伊斯兰国诉求\"那道裂缝最可能的倒戈者——DMS（DMS=西爪哇伊斯兰国）的卡托苏维约一旦在北苏门答腊呼应，他的转向将牵动全局。"
 MLY_Hamka: "哈姆卡"
 MLY_Hamka_DESC: "米南加保乌理玛、改革主义思想家，Muhammadiyah 与《万子》的奠基者之一。\n\n哈姆卡是阿布杜拉赫曼·哈姆扎之子，后者是印尼国民教育与成童年运动的推动者。哈姆卡以散文与杂文蜚声印尼文坛，被视为最杰出的穆斯林现代主义者之一。\n\n他既反对伊斯兰国教化，也反对把西方世俗主义照搬进印尼，主张\"中间道路\"。其作品在马来与苏门答腊拥有广泛读者，是 RSM 党内\"宗教改革派\"的精神象征。\n\n在架空线中，哈姆卡是纳希尔最有力的思想盟友：两人共同构成 RSM 体制内温和而坚定的伊斯兰现代主义轴心，既反对左翼的激进世俗化，也反对 DMS 的神权化。"
 MLY_Sjahrir: "苏丹·沙赫里尔"
 MLY_Sjahrir_DESC: "PSI 创始人，温和社会主义者。\n\n沙赫里尔1916年生于苏门答腊的米南加保—阿拉伯混血贵族家庭，留学荷兰阿姆斯特丹大学。归国后他创建印尼社会主义党（PSI），主张以民主宪政取代威权民族主义。\n\n1945年后他两度出任首相，是印尼共和国独立宣言的签署人之一，被后世尊为\"建国庆派中的自由派\"。\n\n在架空线中，沙赫里尔是 RSM 体制内的自由派旗帜，主张宪政分权、地方自治与军队国家化，反对一党专断。他既是纳希尔的政治盟友，也是其精神制衡者——两人共同构成 RSM 的\"世俗民主派\"，与左翼的丹·马拉卡路线形成张力。"
 MLY_Hatta: "穆罕默德·哈达"
 MLY_Hatta_DESC: "经济学家、国家元老，\"对日合作换实利\"的推动者。\n\n哈达是米南加保 cooperative movement（合作运动）的理论奠基人之一，也是印尼合作社运动的先驱。1930年代他在阿姆斯特丹的经济学训练使他成为当时最能读懂国际经济的一批人之一。\n\n1945年后他出任联合政府财政部长，主持国有银行体系与经济政策的重建。\n\n在架空线中，哈达是 RSM 体制内最清醒的\"现实派\"：他不纠结于\"印尼统一\"这类已不可能实现的宏愿，转而专注于把苏门答腊—马来亚的残缺国家经营好。他主张以务实外交与日本谈判、以合作社经济对抗垄断，是\"技术官僚派\"的核心。"
 MLY_Syafruddin_Prawiranegara: "夏弗鲁丁·普拉维拉内加拉"
 MLY_Syafruddin_Prawiranegara_DESC: "技术官僚派操盘手，主掌财政与经济。\n\n夏弗鲁丁是印尼独立时期的重要经济官员，长期在财政部与中央银行任职。\n\n在架空线中，他代表 RSM 体制内\"技术官僚派\"的实务灵魂，与哈达的经济路线一脉相承。他比哈达更偏重制度建设，主张以国有资本掌握能源与航运命脉，并推动半岛马来经济与苏门答腊资源经济的整合。"
 MLY_Teuku_Muhammad_Hasan: "图库·穆罕默德·哈桑"
 MLY_Teuku_Muhammad_Hasan_DESC: "亚齐裔，亚齐与苏门答腊伊斯兰—地方主义利益的代表。\n\n图穆罕默德·哈桑是亚齐著名乌理玛与政治家，亚齐的伊斯兰现代主义与地方自治运动的重要人物。\n\n在架空线中，他代表 RSM 体制内的亚齐力量：既是虔诚的穆斯林，也是强硬的亚齐地方主义者。他对雅明—纳希尔的\"雅加达式\"世俗路线心存疑虑，主张以苏门答腊的地方宗教认同为立国之本。"
 MLY_Daud_Beureueh: "达乌德·贝鲁埃"
 MLY_Daud_Beureueh_DESC: "亚齐 PUSA 创始人、达鲁伊斯兰最高权威之一，RSM 内部最危险的定时炸弹。\n\n贝鲁埃于1946年在亚齐创建"亚齐独立人民运动"（PUSA），主张亚齐脱离雅加达中央、实行自治。他于1953年9月公开宣布亚齐归属卡托苏维约的"印度尼西亚伊斯兰国"（NII），并于1955年出任其副伊玛目\n\n在架空线中，他公开宣称"真主而非雅加达才是亚齐的主权所在"，其"伊斯兰弧形"路线与西爪哇的卡托苏维约遥相呼应，构成 RSM 南北两端受夹击的根源。\n\n在 RSM 体制内，他被视为"可被争取的亚齐良心"；但 OTL 中他已于1957年向政府投降。在架空线里，只要日本不促成这一和解，他的宗教与地方主义号召力就始终悬在 RSM 框架之外，随时可能与 DMS 合流。"
 MLY_Tan_Malaka: "丹·马拉卡"
 MLY_Tan_Malaka_DESC: "左翼派的精神源头与理论旗号，激进共产主义者、革命家。\n\n丹·马拉卡（Tan Malaka）是印尼民族革命中最具争议也最有号召力的激进左翼领袖。他主张以\"马来亚—印度尼西亚社会主义共和国\"实现真正的民族解放，反对民族主义与资本主义的妥协。\n\n他曾流亡中国、深度参与中国革命，后来返回南洋组织激进共产国际主义力量。\n\n在架空线中，马拉卡是 RSM 左翼派的思想源头与精神图腾。他对雅明的\"残缺国家\"妥协路线嗤之以鼻，主张以\"持久人民战争\"推翻一切旧秩序。他的存在使 RSM 的左翼派始终保持对政权的不合作姿态，是体制内最具爆炸性的不稳定因素。"
 MLY_Aidit: "迪·奈特·艾迪特"
 MLY_Aidit_DESC: "PKI 主席，生于棉兰外港勿拉湾，左翼派在首都圈与华人圈层的旗帜。\n\n艾迪特1923年生于苏门答腊的勿拉湾（Belawan），爪哇—苏门答腊混血家庭，自幼在勿拉湾与棉兰成长。\n\n他在印尼共产党内一路晋升至主席，是冷战初期 PKI 的最高领袖，以亲华与激进民族主义著称。\n\n在架空线中，艾迪特是 RSM 左翼派在苏门答腊与华人社区中的一面旗帜：既代表马共路线，又带有强烈的爪哇—苏门答腊民族解放色彩。他与丹·马拉卡的"革命终点论"一道，构成 RSM 体制内左翼的完整谱系。"
 MLY_Shamsiah_Fakeh: "沙姆西亚·法克哈"
 MLY_Shamsiah_Fakeh_DESC: "马来裔女民族主义者，AWAS 创始人、马来亚妇女运动领袖。\n\n沙姆西亚·法克哈生于西苏门答腊 Bencoolen 的一个马来贵族家庭，是战前马来亚妇女运动（AWAS）的缔造者之一。\n\n她在1940年代创建\"联合苏丹女子运动\"，主张马来女性在独立进程中的政治权利。\n\n在架空线中，沙姆西亚是 RSM 的左翼派与半岛马来青年运动之间的桥梁：她既是马来裔，又主张社会革命与反殖民，是\"半岛马来青年派\"与\"苏门答腊左翼\"合流的关键人物。"
 MLY_Abdullah_CD: "阿都拉·宾·卡里姆·哈贾·阿都拉西迪"
 MLY_Abdullah_CD_DESC: "马来裔共产主义者，KMM 创始成员，马共第 10 支队创建者与首任领导人。\n\n阿都拉西迪生于霹雳州甘榜兰博尔基里村的一个矿工家庭，1939年参与创建马来青年同盟，此后投身抗日运动。\n\n1945年他加入马来亚共产党，并参与创建马来亚马来国民党；1948年牛车水事件后，任工党人民抗日军第十支队（"第十支队"）首任司令员，成功在丛林中开辟根据地。\n\n在架空线中，阿都拉西迪是 RSM 体制内"下马来左翼"的旗手：他既是马来裔，又有明确的反殖民革命立场，在马来工农群众中号召力极强。他被授予陆军中将与军团指挥官职务，是左翼派在军中的代表人物。"
 MLY_Nasution: "亚辛·哈辛·纳苏通"
 MLY_Nasution_DESC: "巴塔克穆斯林，武装部队司令，首都棉兰所在北苏门答腊军区实际控制人。\n\n纳苏通1906年生于苏门答腊的哥打礼让（Tapanuli）巴塔克贵族家庭，是虔诚的穆斯林与坚定的民族主义者。\n\n他以卓越的战术素养与"竹刺线"战法闻名，二战后长期担任印尼陆军总司令。\n\n在架空线中，纳苏通是 RSM 军权核心：北苏门答腊军区掌握着棉兰周边的高原与资源地带，他既能约束文官政府，也能在必要时成为军事政变的推手。他是巴塔克族群利益的最高代表，也是雅明总统最难绕过的人物。"
 MLY_Simatupang: "特多多·博尼·西马图潘"
 MLY_Simatupang_DESC: "巴塔克基督徒，总参谋长，以\"专业化、去党派化\"平衡各方。\n\n西马图潘1912年生于苏门答腊的哥打礼让，与纳苏通同乡，同样出身巴塔克精英家庭。\n\n他以稳健著称，战间与战后长期担任印尼军队总参谋长，主张军队\"超党派、专业化\"，反对军人干政。\n\n在架空线中，西马图潘是 RSM 体制内的\"平衡器\"：他既是纳苏通的同乡与制衡者，又主张军队不介入政党政治。其\"去党派化\"立场使他在雅明—军方与左翼之间游走，是体制中最有信誉的技术型军人。"
 MLY_Achmad_Tahir: "艾哈迈德·塔希尔"
 MLY_Achmad_Tahir_DESC: "北苏门答腊出身，海军转陆军军官，主掌马六甲海峡防务。\n\n塔希尔生于苏门答腊北岸的亚齐附近，早年加入皇家海军，后转入陆军。\n\n他以战术素养与对马六甲海峡水道的熟悉著称。\n\n在架空线中，塔希尔是 RSM 海军—陆战队系统的代表，掌握马六甲海峡的防御与监视——这是 RSM 立国之本的经济命脉。他既是雅明的军方支点，也在关系未来马六甲海峡利益分配上具有不可忽视的发言权。"
 MLY_Ibrahim_bin_Yaacob: "易卜拉欣·本·雅各布"
 MLY_Ibrahim_bin_Yaacob_DESC: "半岛马来青年派旗手，KMM 创始人、\"火炬\"运动组织者。\n\n易卜拉欣·本·雅各布1921年生于森美兰州的罗马华人聚落，是华裔马来人，父亲来自中国。\n\n他 1937 年参与创建\"吉隆坡马来青年会\"并出任秘书，主张马来青年应掌握马来语与马来文化认同，同时争取华人与马来人的团结。\n\n他1948年与陈平共同创建马来亚民族主义政党 马来亚马来国民党，任秘书长。\n\n在架空线中，雅各布是 RSM 中\"半岛马来青年派\"的组织者与象征：他在 1940 年代将马来青年运动从保守的乌理玛圈子带入现代政党政治，为后续\"半岛马来—苏门答腊\"联盟提供了组织形态。其日据时期的反日活动也使其成为罗摩佐亚党反殖民传统的继承者。"
 MLY_Mustapha_Hussain: "穆斯塔法·侯赛因"
 MLY_Mustapha_Hussain_DESC: "KMM 首任主席，半岛事务部长，雅克布的政治导师。\n\n穆斯塔法·侯赛因生于吉打州，是马来亚马来国民党 的首任主席，也是半岛事务部首位部长。\n\n他是 1940 年代马来民族主义政治的老将：在《马来亚人的抉择》等著作中系统阐述了马来人的政治自觉与民族权利。\n\n在架空线中，侯赛因代表\"半岛马来民族主义\"的稳健路线：以争取马来人的文化与政治权利为起点，主张在新的国家框架内实现马来人的主体地位。他与雅各布的\"青年运动\"路线共同构成 RSM 建国的马来政治骨架。"
 MLY_Rashid_Maidin: "拉希德·迈丁"
 MLY_Rashid_Maidin_DESC: "马来裔共产主义者，左翼派的\"谈判—统战\"角色，第十支队首任司令员。\n\n拉希德·迈丁1915年生于森美兰的马来家庭，是马来亚共产党内最具影响力的马来裔干部之一。\n\n1946—1948年任马来亚人民党主席，随后在第十支队运动中担任重要指挥员。\n\n在架空线中，迈丁是 RSM 左翼派中最擅长议会统战的人物：他在马来工人与农民中拥有真实号召力，同时又不拒绝与体制内其他派系合作，是\"左翼统一战线\"的实际操盘手。其陆军少将与军团指挥官衔，反映了 RSM 对马来军人的吸纳。"
