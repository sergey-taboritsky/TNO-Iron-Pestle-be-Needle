 MLY_Chaerul_Saleh: "查赫鲁尔·萨利赫"
 MLY_Chaerul_Saleh_DESC: "青年派出身的米南加保技术官僚，基础工业部长。\n\n萨利赫 1927 年生于西苏门答腊的沙哇伦多，日占时期在爪哇的学生与青年动员网络中长大，战后以「能办事」而不是「能鼓动」出名。他在共和国里的位置很特殊：他从不喊米南加保特殊论——米南加保本来就是这个国家的承重结构，没必要再去争取一样已经握在手里的东西。\n\n他的立场取决于谁坐在棉兰那把椅子上。只要政权仍由米南加保文官集团主导，他就是效率最高的执行者，替国家把橡胶、锡与石油换成工厂、公路与兵工厂；可一旦亚明之后由巴塔克军人、半岛马来派或亚齐宗教势力接管，他会立刻变成议会里最难缠的反对派——不是因为他变节，而是因为他全部的政治资本都绑在「米南加保治国」这条线上。那条线断了，他就只能站到对面去。"
 MLY_Dato_Onn_Jaafar: "拿督翁·惹化"
 MLY_Dato_Onn_Jaafar_DESC: "柔佛出生的马来贵族与官僚，半岛马来政治的头号人物，1962 年 1 月病逝。\n\n翁·惹化 1895 年生于柔佛新山，日占时期留在柔佛的民政体系中任职，1946 年以「马来人团结」为号召组织起半岛马来人的政治机器。1947 年分治后，半岛被并入以棉兰为首都的共和国，他成了这个国家里最不合时宜的人：他一生争取的是马来人在自己土地上的主体地位，而共和国的承重墙在海峡对岸的米南加保人手里。\n\n他被留在柔佛，被供养、被尊崇、也被架空——共和国需要他的名字来证明半岛马来人确实是这个国家的一半，却不需要他的意见。开局他在世，十余日后即在新山去世；他的死会在半岛马来政治中留下一个谁也补不上的空洞。"
 MLY_Chin_Peng_DESC: "马来亚共产党的书记，也是这个国家唯一一个「从来不在体制内」的人物。\n\n陈平 1924 年生于霹雳实兆远，1939 年入党，日占时期在半岛的抗日武装中做组织与联络工作。1947 年总书记莱特叛变失踪后，他接掌了这个党。\n\n在架空线里他的处境更坏，也更简单：这个世界线的半岛上没有英军，没有那支会给他勋章的 136 部队，也没有 1948 年的紧急状态——他连「被盟军背叛」这道程序都省了。1947 年的分治把半岛交给了一个「米南加保—半岛马来」共治的共和国，华人既不是统治集团的一半，也不是被承诺同化的公民，而是被明确压制、同时被明确需要的税基。共和国的建国契约就是「半岛马来人需要米南加保人来压制华人」，陈平正是这份契约要压制的对象。因此他不需要任何叛乱的借口——他从来就没有被纳入过。\n\n他不出现在开局的政府名单里。只有当半岛华人的处境被某一方的政策彻底点燃时，他才会带着一支主要由华人组成的队伍从丛林里走出来，纲领既反日本，也反棉兰。"
 TNOIPN_MLY_minangkabau_malay_compact: "米南加保—半岛马来契约"
 TNOIPN_MLY_minangkabau_malay_compact_desc: "这个国家建立在一笔交易上：苏门答腊的米南加保人出政权、出财政、出文官；半岛的马来人出民族合法性与土地；作为交换，米南加保人替半岛马来人压制半岛上的华人。\n\n只要这笔账还算得过来，共和国就稳；一旦其中一方觉得自己付多了，整个国家就会沿着海峡裂开。"
 TNOIPN_MLY_the_chinese_question: "华人问题"
 TNOIPN_MLY_the_chinese_question_desc: "半岛的华人是这个国家最尴尬的组成部分：他们掌握着城镇的商业与税源，却既不能参军，也不能在政治上代表自己。\n\n共和国把他们当作需要被管住的钱袋子——压制是日常，容忍是策略，一旦压制过头，丛林里就有人等着接手。"
 TNOIPN_MLY_batak_officer_corps: "巴塔克军官团"
 TNOIPN_MLY_batak_officer_corps_desc: "日本人在苏门答腊招募义勇军时，刻意把枪交给了基督徒与传统信仰占比很高的巴塔克青年，而不是虔诚的米南加保或亚齐穆斯林。\n\n结果是：1945 年之后，苏门答腊唯一拥有完整训练与指挥链的人群是巴塔克人。米南加保人掌握国家机器，巴塔克人掌握枪——这条不成文的界线，才是共和国真正的宪法。"
 TNOIPN_MLY_severed_archipelago: "残缺的群岛"
 TNOIPN_MLY_severed_archipelago_desc: "共和国只有苏门答腊与马来半岛。爪哇在日惹苏丹国手里，群岛以东的十几邦国被锁进日本人设在贾加鲁塔的努山塔拉邦联，加里曼丹干脆是日本海陆两军的军属殖民地。\n\n「印度尼西亚」这个名字所承诺的那片土地，有一多半不归它管。收复失土是军队唯一的共识，也是这个国家唯一能同时说服米南加保文官、巴塔克将军与半岛马来政客的口号。"


 MLY_Yeung_Kwok: "杨果"
 MLY_Yeung_Kwok_DESC: "马来亚共产党政治局委员，陈平的副手，也是这个党里唯一一个资历比陈平老的人。\n\n杨果 1919 年生于槟城，钟灵中学高材生，比陈平年长五岁。1938 年陈平尚未出道时，他已经是马共槟城市委。1941 年他被殖民当局逮捕并强制遣返中国，船开到半路日本南侵，被迫折返马来亚；1942 年派往雪兰莪，就此躲过了同年在新加坡的那场大逮捕——那一次是总书记莱特出卖的，二号人物黄诚被折磨致死。1947 年 6 月九扩会议他当选政治局委员，陈平出国期间代理总书记。\n\n在架空线里他活着，理由很硬：打死他的那支部队不存在。在我们的世界里他于 1956 年 8 月率队出去解决粮食困难时遇袭牺牲，射杀他的是英军巡逻队；这个世界线的半岛上没有英军。槟城在共和国版图内，所以他现在是共和国公民，而他的党是共和国境内唯一一个从 1930 年代起就没断过香火的组织——比执政党老，比共和国本身老。\n\n他领导的那一半是华人：被明确压制、同时被明确需要的税基。它可以公开无神论、公开国际主义、公开武装斗争，因为它不需要向任何一座清真寺负责；代价是它永远越不过族群边界，而那条边界正是共和国的地基。"
 MLY_Aidit: "迪帕·努山塔拉·艾地"
 MLY_Aidit_DESC: "印度尼西亚共产党在共和国境内的负责人。他是这个国家最危险的一种人：一个共和国公民，却为一个共和国管不到的中央工作。\n\n艾地 1923 年生于勿里洞丹绒班丹——在架空线里，勿里洞属于共和国。少年时代到爪哇读书，日占时期在雅加达 Menteng 31 宿舍听苏加诺、哈达、阿米尔·谢里夫丁、苏巴佐与基·哈查尔·德万托罗讲政治课；1943 年加入自由印尼运动并主持其政治委员会；1944 年入选「最忠于苏加诺的一百人」；独立前一年进海军少将前田精出资创办的独立养正塾学习，同期学员有卢克曼、西迪·克塔帕蒂、查利德·拉希迪，主持人是维卡纳。\n\n三件事决定了他在 1962 年的位置。第一，他是「苏加诺的人」——日本手里除了苏加诺本人，还握着一小撮宣誓忠于苏加诺的年轻人，艾地是其中之一。第二，他受教育的那所学校是日本海军出钱办的，沙里尔当年就怀疑它的目的是培养渗透分子打进左翼地下组织、把左翼分化成亲莫斯科派和民族主义派。第三，他的党中央在爪哇，在日惹苏丹国与努山塔拉邦联那一边——他有群众，却没有头。\n\n他这一半是马来人与苏门答腊人，所以他必须在伊斯兰内部做共产主义——这也是印尼共与马共的根本分工：马来人归他，华人归陈平：不能公开无神论，不能公开国际主义，要在清真寺、宗教学校、工会和乡村里讲土地与穷人的事。而共和国手里正好有一台为他定制的机器——苏莱曼·阿尔-拉苏利的伊斯兰法庭，可以裁定他的人还算不算穆斯林。"
 MLY_Rashid_Maidin: "拉希德·迈丁"
 MLY_Rashid_Maidin_DESC: "印尼共半岛局书记。他曾是马共的第一位马来人党员、也是全部由马来族组成的第十支队的指挥官——后来转投印尼共。他是两个红色政党之间唯一的活结，也是唯一一个两边都要抢的人。\n\n1917 年 10 月生于霹雳务边的甘榜 Gunung Mesah，小学五年级因贫困辍学，在金马仑高原打零工时跟一名传教士学了英语，回务边后在法国人开的电站做工，考下一级电工证——他是工人出身，不是学生出身，这在群岛左翼里是少数。他自幼受霹雳马哈拉惹列拉抗英事迹的感召，1939 年接触马共，1941 年正式入党，成为该党第一名马来人。日占时期他是党内级别最高的马来人之一；战后陈平亲自委派他，与阿卜杜拉·西迪共同指挥第十支队。1947 年他代表马共出席伦敦的共党会议；1955 年华玲会谈，马共代表团是陈平、他、陈田——一个华人总书记、一个马来人司令、一个华人宣传部长，这个构成本身就是党的自我展示。\n\n1962 年他的处境是：提拔他的是陈平，但陈平的党是华人的党；能给他一个「马来人可以带着信仰进去的党」的是艾地，但艾地的中央在爪哇。他是唯一一个两党都要争取的人，而他自己的族群只有一个。"
 MLY_Sulaiman_ar_Rasuli: "苏莱曼·阿尔-拉苏利"
 MLY_Sulaiman_ar_Rasuli_DESC: "PERTI 的创始人，Kaum Tuo（传统派）的柱石，1947 年 1 月 17 日起任中苏门答腊伊斯兰法庭首长。1962 年他九十一岁，活着本身就是这个体制的抵押品。\n\n1871 年生于阿甘县甘东，1881 年在巴图汉帕尔跟阿卜杜勒·拉赫曼学古兰经——那位老师是哈达的祖父，也就是说，共和国的宗教权威与共和国最资深的技术官僚，共享同一条师承。1903 年赴麦加，1908 年回甘东开 surau，1928 年与穆罕默德·贾米勒·贾霍等人创立 PERTI。日占时期他是日本设立的高等伊斯兰评议会（MIT）主席，1943 年作为米南加保代表出席新加坡的乌来玛会议。\n\n他最广为人知的那句话是 adat basandi syarak, syarak basandi Kitabullah——习惯法以教法为本，教法以古兰经为本。这句话在架空线里不是一句格言，是一笔交易的价格：共和国用它换米南加保母系制的教法背书，换来的是一台能判定谁还算穆斯林的机器。而那台机器真正要对付的，是艾地那半个党——一个必须在伊斯兰内部做共产主义、因此最怕被逐出教门的党。在母系制下，被逐出氏族等于从世界上消失。"
 MLY_Rahmah_El_Yunusiyah: "拉赫玛·埃尔·尤努西亚"
 MLY_Rahmah_El_Yunusiyah_DESC: "1923 年创办东印度第一所女子伊斯兰学校 Diniyah Putri 的人，氏族长老会在国家机器里的声音。\n\n1900 年生于巴东班让的乌来玛世家，父亲是卡迪，祖父是纳格什班迪教团的领袖。1916 年被家里安排出嫁并被迫辍学，1922 年丈夫另娶两房，她离了婚，回去读书。1923 年开办女子经学校，最初的七十一名学生多是附近的年轻家庭主妇。她拒绝荷兰当局的一切资助，因此坐过荷兰人的牢。1955 年她成为独立后首批当选人民协商会议的女性之一——党籍挂在执政党的塔比亚传道会一翼，可她的票仓从来不在任何党里。\n\n她的事业之所以可能，靠的正是米南加保的母系制：女性作为 Bundo Kanduang 保有氏族地位与财产处分权，她才有办学的自由。换句话说，共和国那个「母系制的权威在女性手里」的事实，在她身上第一次变成政治事实，而她背后站的是氏族长老会，不是党。第三道门后面站着的不是一群老人，是一个办了四十年学校的女人。"
 MLY_Adnan_Kapau_Gani: "阿德南·卡保·加尼"
 MLY_Adnan_Kapau_Gani_DESC: "医生、首任南苏门答腊州长、石油与走私的经手人——也是总统的主治医师。他是全党唯一有资格说「不」的人。\n\n1905 年生于西苏门答腊巴伦巴扬（武吉丁宜以西）一个教师家庭，1926 年毕业于 STOVIA。青年时代是爪哇青年与苏门答腊青年的成员，靠经营寄宿公寓和旧书店赚钱，把钱捐给了 1928 年那场宣读青年誓词的大会。1941 年他主演了电影《纯洁的爱情》，是荷属东印度第一部面向知识观众的本土片。\n\n日本占领后他拒绝合作，1943 年 9 月被捕，关到次年 10 月——这是执政党内少见的一段干净履历。出狱后他行医到战争结束，1945 至 46 年任南苏门答腊首任州长，认定巨港的石油可以换来国际支持，一边跟壳牌谈生意，一边突破封锁走私军火，靠的是他在新加坡华人社群里的人脉。\n\n1962 年的图景是：一个因为不肯与日本合作而坐过日本牢的米南加保医生，在给一个靠日本人上台的米南加保总统看病。他每天知道总统还能撑多久，六派都要向他买这个消息；但他档案里那一年牢，让他有资格谁都不卖。"
 MLY_Awaluddin_Djamin: "阿瓦卢丁·贾明"
 MLY_Awaluddin_Djamin_DESC: "巴东出生的米南加保警官，国家警察首脑，国家安全委员会的第五名成员。\n\n1927 年生，1950 年进入警察系统，之后一路做到印尼警察总长。1962 年他三十五岁，是这个体制里少有的少壮派技术官僚：不属任何派系，也不背任何 1942 年的旧账，因为他当年还没成年。\n\n在架空线里他的价值恰恰在于「干净」——1942 年新加坡日本警察学校毕业的那批米南加保警官，是共和国行政与镇压机器的骨架，而他们每一个人的履历上都印着占领当局的印章。贾明是第一批不需要为那枚印章辩解的人。他掌握的是警察、户籍与审查，也就是这个国家唯一能实时看见华人社区在做什么的眼睛。"
 MLY_Tan_Siew_Sin: "陈修信"
 MLY_Tan_Siew_Sin_DESC: "马六甲峇峇，家族种植园的继承人，华人商会里说话最管用的那一个。\n\n1916 年生于马六甲，是陈祯禄的独子。他不会说华语——他的世界是峇峇的商业网络、殖民行政与英语教育，而不是会馆、华校与方言群。1935 年罹患肺结核，在瑞士手术痊愈；1939 年父亲把他从伦敦召回马六甲接管家族生意，法律学业只念了一年就中断。1955 年当选马六甲议员，先任工商部长，后长期掌财政，1961 年起出任马华公会总会长。\n\n在架空线里他处在一个极端的位置上：半岛华人既不能投票、不能参军、不能在政治上代表自己，却掌握着城镇的商业与税源。共和国要的正是这个——一个既有钱、又不会被怀疑有族群忠诚的人来当华人的代表。他肯替政府收税、替政府担保、替政府在华人社区里灭火，条件是这个国家别把华人逼到丛林里去。而丛林里有人在等。"

 MLY_Sirajuddin_Abbas: "西拉杰丁·阿巴斯"
 MLY_Sirajuddin_Abbas_DESC: "PERTI 的主席，Kaum Tuo 这一支实际上的政治操盘者。1962 年他五十余岁，而握着伊斯兰法庭的那位老人九十一。\n\n他是阿巴斯·卡迪的儿子——1918 年那位在武吉丁宜把 surau 改造成新式学校的教长，米南加保传统派教育现代化的起点。1933 年赴麦加游学，回米南加保后接手父亲的学校，三年内以讲学与宣教成名，1936 年在武吉丁宜的第三次代表大会上当选 PERTI 主席，此后二十六年没有离开这个位子。1937 年他办起党刊《Soearti》，直到 1942 年才停刊——那是这个组织除了清真寺之外的第二条血管。\n\n他在体系里的位置是一个裂缝。PERTI 的创始人苏莱曼·阿尔-拉苏利任中央顾问委员会主席，是共和国宗教权威的名义首脑，1947 年起兼任中苏门答腊伊斯兰法庭首长；但党、议会、选票、与政府的谈判，全是阿巴斯在跑。也就是说，这个国家用来裁定「谁还算穆斯林」的那台机器，名义上属于一个九十一岁的老人，操作它的却是一个五十多岁的政党主席。\n\n他还有一条暗线：1950 年代，PERTI 在亚齐的分支在穆达·瓦利·哈利迪带领下组织人民醒悟团，武装对抗达鲁伊斯兰。也就是说，在这个国家的亚齐问题上，传统派是站政府这一边的——而他们站的那个政府，是用宗教法庭的牌照换来的。"
 MLY_ultranationalism_1_party: "马来人民党"
 MLY_ultranationalism_1_party_long: "马来人民党(Parti Rakyat Melayu，PRM)"
 MLY_Sukarni: "苏卡尼"
 MLY_Sukarni_DESC: "1916年生于爪哇勿里达，穆尔巴党主席，丹马六甲著作的荷译印尼第一人，是他把“持续革命”带进了群岛的青年地下。\n1945年8月，是他把苏加诺和哈达“请”到了伦加斯登克罗——那场逼宫在本线没有换来承认，换来的是日本宪兵队的名单。\n1947年甄别时他逃过一劫，此后化名“迈迪”再次失踪——和1937年一样，这一次是在南加里曼丹的油田里，在中国共产党的南洋临委与日本海军军政之间的缝隙中。\n他自称不是爪哇人，而是“所有被这片土地拒绝的人的同胞”。他要的不是守住共和国，而是让“印度尼西亚”这个词配得上它自己。"
 MLY_Sutomo: "苏托莫"
 MLY_Sutomo_DESC: "1920年生于泗水，人称“朋·托莫”。1945年11月，他的广播声嘶力竭地驱动着泗水的革命民兵冲向英军——“泗水的声音”由此成为革命最著名也最狂热的嗓子。\n本线里爪哇没有起义，只有流亡。他随一批爪哇青年民族主义者东渡棉兰，把他的广播台重新架了起来。\n在共和国，他的电台既骂殖民者，也骂政府——他说日本的分治是“新的伦加斯登克罗”，这一次被“请”来逼宫的是整个爪哇的亡魂。"
 MLY_Jaafar_Albar: "赛义德·贾法尔·阿尔巴"
 MLY_Jaafar_Albar_DESC: "1914年生于望加锡的哈德拉毛阿拉伯裔家庭，十四岁移居新加坡。他一生最著名的宣言只有一句：“无论我身处何地，我都是马来人。”——尽管他的血统既非马来也非华人。\n他是马来青年联盟(KMM)的老兵，1942年组织被日本取缔后转入地下，在昭南的军政缝隙里活了十五年。\n1957年，他从执政党“半岛印尼人运动”中出走，把地下十五年的KMM重建为马来人民党(PRM)。他说得很清楚：国家的名字可以叫印度尼西亚，但半岛只能是马来人的半岛——华人是“投宿者”，不是住户。"
 MLY_Senu_Abdul_Rahman: "塞努·阿卜杜勒·拉赫曼"
 MLY_Senu_Abdul_Rahman_DESC: "1920年生，吉打人，KMM复活后的组织者。阿尔巴是半岛极端民族主义的嗓子，塞努是它的骨架：会员名册、地下网络、青年营，都在他手里。\n他与阿尔巴并称“双骑”，主张对华人经济地位发起一场“不流血的清算”。政府把他们看作麻烦，宫廷把他们看作刀。"
 MLY_Sukarjo_Wiryopranoto: "苏卡尔佐·维里奥普拉诺托"
 MLY_Sukarjo_Wiryopranoto_DESC: "1902年生，战前大印度尼西亚党的新闻旗手，日占期任《爪哇新闻》社长——那支1941年被荷兰人禁止的、类似纳粹礼的敬礼，他从来不觉得有什么问题。\n1947年后他成了旧Parindra亲日翼的活招牌：日本需要一张老脸来证明“合作有出路”，他需要日本的报纸与电台。\n他的身体撑不了太久了，这一点他自己知道，日本也知道。"
 MLY_RP_Soeroso: "拉登·潘吉·苏奥罗佐"
 MLY_RP_Soeroso_DESC: "1893年生，战前Parindra最后一位在世的元老。他为这个党守了一辈子“体面”：可以合作，可以宣誓，但青年团的敬礼必须行得端正。\n1947年之后他不再谈爪哇——那太痛苦——他谈的是“职团”：让氏族、农会、商会和军队各成一院，让选举这种东西随着1955年一起退休。\n年轻人叫他“教授”，日本人叫他“可敬的朋友”，他两边都不否认。"
