	SRB_Iskaq_Tjokrohadisurjo:0 "Iskaq Tjokrohadisurjo"
	MLY_Yamin_DESC:0 "RSM 首任总统，米南加保裔知识分子、诗人、法学家，革命文人正统，日本有条件独立框架下的国家元首。"
	MLY_Natsir_DESC:0 "Masyumi 主席，米南加保—伊斯兰双重身份，亚明争取宗教阵营的关键纽带，兼跨建国庆派与伊斯兰派。"
	MLY_Hamka_DESC:0 "米南加保乌理玛、改革主义思想家，Muhammadiyah 与 Masyumi 要员，负责意识形态与宗教文宣。"
	MLY_Sjahrir_DESC:0 "PSI 创始人，温和社会主义者，建国庆派中的自由派/社会民主一端，左翼派的精神近邻。"
	MLY_Hatta_DESC:0 "经济学家、国家元老，党内最清醒的『对日合作换实利』推手，任总理或首席经济顾问。"
	MLY_Syafruddin_Prawiranegara_DESC:0 "技术官僚派操盘手，主掌财政与央行，在『对日资源供给』与『本国财政自主』间走钢丝。"
	MLY_Teuku_Muhammad_Hasan_DESC:0 "亚齐裔，亚齐与苏门答腊伊斯兰—地方势力总代表，宗教事务部长级『苏门答腊事务总监』。"
	MLY_Daud_Beureueh_DESC:0 "亚齐 PUSA 创始人，达鲁伊斯兰领袖，RSM 内最强的离心伊斯兰势力，若中央世俗化过度便起事。"
	MLY_Tan_Malaka_DESC:0 "The spiritual source of the left - and a dead man. Arrested by the Kempeitai in 1946 during the sweep of the southern rejectionist networks and secretly executed around the 1947 settlement; the occupation never admitted more than that 'the extremist died in custody'. Born at Suliki in West Sumatra, he was Minangkabau like Yamin, Hatta and Natsir - which is exactly why Tokyo could not buy him: a Minangkabau could always point at the chair in Medan and say it had been carried there on bayonets. In this timeline he is dead, and more useful dead than alive: the underground left venerates him as a martyr, his 'third camp' collapsed without him - the young cadres who should have followed him drifted into the state and ended up as programme-less technocrats."
	MLY_Nasution_DESC:0 "巴塔克穆斯林，武装部队司令，首都棉兰所在北苏门答腊军区实际掌控者，总统对日协作与镇压力量执行人。"
	MLY_Simatupang_DESC:0 "巴塔克基督徒，总参谋长，以『专业化、去党派化』平衡各派，军队派中的技术—宪政一翼。"
	MLY_Achmad_Tahir_DESC:0 "北苏门答腊出身，海军转陆军军官，主掌马六甲海峡防务与海军，负责对日海军协作与航运安保。"
	MLY_Ibrahim_bin_Yaacob_DESC:0 "半岛马来青年派旗手，KMM 创始人，『大印尼』思想旗手，RSM 半岛并入的关键推手。"
	MLY_Mustapha_Hussain_DESC:0 "KMM 首任副主席，半岛事务部长，Yaacob 系在半岛西岸城市集群的组织骨干。"
	DMS_Kartosuwiryo:0 "S.M. Kartosuwiryo"
	DMS_Kartosuwiryo_DESC:0 "达鲁伊斯兰（Darul Islam）领袖，OTL 1949 年在西爪哇宣布建立伊斯兰国并自任伊玛目，主张以伊斯兰法统一全印尼。在架空线里为 DMS（西爪哇）的最高权威与意识形态核心，RSM 的死敌，宣称 RSM 是『叛教者的世俗政权』。"
	DMS_Amir_Fatah:0 "Amir Fatah"
	DMS_Amir_Fatah_DESC:0 "达鲁伊斯兰西爪哇战地司令，OTL 曾领导西爪哇 DI 游击。在架空线里作为 DMS 的野战指挥官，负责反 RSM 的圣战前线，是 DMS 的武力支柱之一。"
	SHO_Lim_Tianbao:0 "Lim Tianbao"
	SHO_Lim_Tianbao_DESC:0 "President of the Syonan Overseas Chinese Association during the Occupation and the man who actually ran it. He organised the levy of the 50 million dollar indemnity across the ten Malayan states, a burden the Chinese communities have never forgotten. Japan trusts him for his pre-war pro-Japanese record; the Chinese remember what he took from them. In 1962 he is made mayor of Syonan: the man who took the money now governs the city."
	SHO_Tan_Yeok_Seong:0 "Tan Yeok Seong"
	SHO_Tan_Yeok_Seong_DESC:0 "Historian, publisher, and secretary of the Syonan Overseas Chinese Association. He spent the Occupation compiling the first-hand record of the Japanese indemnity, then published it after the war. His double life - collaborator and witness - makes him the perfect intermediary for a Japanese administration that must keep the Chinese quiet. Appointed mayor of Syonan in 1962, he is the only man who both served the Japanese and can prove what they did."

	SRB_Woerjaningrat_DESC:0 "Elder of the Great Indonesia Party (Parindra) and a Surakarta aristocrat, the old face of pre-war 'cooperative' nationalism. He stayed in Java after the 1947 partition and became the public front of the Sultanate's civilian establishment - his function is not to decide, but to make a Japanese-sponsored regime look like it still carries the legitimacy of the pre-war movement. His birth year is unrecorded; by 1962 he is an old man."
	SRB_Susanto_Tirtoprodjo_DESC:0 "Jurist born in Surakarta, member of the Japanese-created BPUPK, Minister of Justice, acting Prime Minister and Governor of the Lesser Sunda (1950-52). After the partition he runs the Sultanate's judicial and interior reconstruction, crowning the administrative framework Japan left behind with procedural legality; he is also the SRB's legal expert for dealing with the member states of the Nusantara Confederation."
	SRB_Iskaq_Tjokrohadisurjo_DESC:0 "Co-founder of the Indonesian National Party alongside Sukarno in 1927, Leiden-trained jurist, and an administrator under the Occupation: assistant resident of Banyumas and member of the central advisory council. As resident of Surakarta in 1946 he was kidnapped by communists. He is both Sukarno's peer and a man who worked with the occupation - the most senior and most controversial civilian chief of the Sultanate, the living legacy of the old Javanese PNI, and a man who left a corruption case behind him in the 1950s."

	MLY_Chaerul_Saleh:0 "Chaerul Saleh"
	MLY_Chaerul_Saleh_DESC:0 "A Minangkabau technocrat out of the Angkatan '45 youth generation, Minister of Basic Industry. Born at Sawahlunto in West Sumatra in 1927, he grew up in the student and youth mobilisation networks of occupied Java and made his name after the war as a man who gets things done rather than a man who agitates. He never preaches Minangkabau particularism: Minangkabau already ARE the load-bearing structure of this republic, and there is no use demanding something already in hand. His position depends on who sits in the chair at Medan. While the Minangkabau civilian establishment rules he is its most efficient executor, turning rubber, tin and oil into factories, roads and arsenals; the moment a Batak junta, a peninsula Malay faction or an Acehnese religious bloc takes over after Yamin, he becomes the most troublesome opposition in the assembly - not because he changed sides, but because every scrap of his political capital is tied to the line 'Minangkabau governs'. Break that line and he can only stand on the other side of it."
	MLY_Dato_Onn_Jaafar:0 "Dato Onn Jaafar"
	MLY_Dato_Onn_Jaafar_DESC:0 "A Johor-born Malay aristocrat and bureaucrat, the foremost figure of peninsula Malay politics, dead in January 1962. Born at Johor Bahru in 1895, he served in the Johor civil administration under the Occupation and in 1946 organised the peninsula Malay political machine around the call for Malay unity. After the 1947 partition folded the peninsula into a republic whose capital is Medan he became the most out-of-place man in the country: everything he ever fought for was Malay primacy on Malay soil, while the load-bearing wall of this republic belongs to Minangkabau across the strait. He was left in Johor - pensioned, honoured and sidelined. The republic needs his name to prove that peninsula Malays are half of this country; it does not need his opinions. He is alive at the start and dies at Johor Bahru a little over a fortnight later, leaving a hole in peninsula Malay politics that nobody can fill."
	MLY_Chin_Peng_DESC:0 "Secretary-General of the Malayan Communist Party, and the only man in this country who was never inside the system to begin with. Born at Sitiawan in Perak in 1924, he was a backbone of the anti-Japanese resistance on the peninsula, cooperated with the British and was decorated for it, and went into the jungle after 1948. In this timeline his position is worse and simpler than in ours: the 1947 partition handed the peninsula to a Minangkabau-peninsula Malay condominium in which the Chinese are neither half of the ruling bloc nor citizens promised assimilation, but a tax base that is at once expressly suppressed and expressly needed. The founding compact of the republic is that peninsula Malays need the Minangkabau in order to hold the Chinese down - and Chin Peng is precisely what that compact exists to hold down. He therefore needs no pretext for revolt: he was never included. He does not appear in the opening government. Only when some faction's policy sets the peninsula Chinese alight will he walk out of the jungle with a mostly Chinese force and a programme that is against Tokyo and against Medan alike."
	TNOIPN_MLY_minangkabau_malay_compact:0 "The Minangkabau-Malay Compact"
	TNOIPN_MLY_minangkabau_malay_compact_desc:0 "The republic rests on one transaction: the Minangkabau of Sumatra supply the state, the treasury and the civil service; the Malays of the peninsula supply national legitimacy and land; in exchange the Minangkabau help hold down the Chinese of the peninsula. As long as the account balances the republic holds; the moment either side thinks it is paying too much, the country splits along the strait."
	TNOIPN_MLY_the_chinese_question:0 "The Chinese Question"
	TNOIPN_MLY_the_chinese_question_desc:0 "The Chinese of the peninsula are the most awkward component of this state: they control the commerce and the tax base of the towns, yet they may neither serve in the army nor represent themselves politically. The republic treats them as a purse that has to be kept shut - suppression is routine, tolerance is tactics, and if suppression goes too far there is somebody in the jungle waiting to take over."
	TNOIPN_MLY_batak_officer_corps:0 "The Batak Officer Corps"
	TNOIPN_MLY_batak_officer_corps_desc:0 "When the Japanese raised auxiliary forces in Sumatra they deliberately handed rifles to Batak youths - among whom Christians and adherents of the old faith were numerous - rather than to devout Minangkabau or Acehnese Muslims. The consequence: after 1945 the only people in Sumatra with complete training and a chain of command were Bataks. The Minangkabau hold the machinery of state, the Bataks hold the guns, and that unwritten line is the real constitution of the republic."
	TNOIPN_MLY_severed_archipelago:0 "A Severed Archipelago"
	TNOIPN_MLY_severed_archipelago_desc:0 "The republic has Sumatra and the Malay peninsula. Java belongs to the Sultanate of Yogyakarta, the dozen eastern states are locked inside the Japanese-sponsored Nusantara Confederation at Jakaruta, and Borneo is outright military colonial territory split between the Japanese Navy and Army. More than half of what the name 'Indonesia' promised is not theirs. Recovery of the lost territories is the army's only consensus and the only slogan that can move Minangkabau civilians, Batak generals and peninsula Malay politicians at the same time."


	MLY_Yeung_Kwok:0 "Yeung Kwok"
	MLY_Yeung_Kwok_DESC:0 "Politburo member of the Communist Party of Malaya, Chin Peng's deputy, and the only man in the party whose seniority outranks his leader's. Born at Penang in 1919, a prize student of Chung Ling High School and five years older than Chin Peng, he was already secretary of the Penang city committee in 1938 when Chin Peng had not yet surfaced. Arrested in 1941 and deported to China, his ship was turned back by the Japanese invasion; sent to Selangor in 1942, he thereby missed the great arrests in Singapore that year - the ones Lai Tek had betrayed, in which the party's number two was tortured to death. Elected to the Politburo at the Ninth Enlarged Plenum in June 1947, he served as acting General Secretary while Chin Peng was abroad. \n\nHe is alive in this timeline for a hard reason: the unit that killed him does not exist. In our world he died in August 1956, leading his comrades out to solve a food shortage, shot by a British patrol; there are no British patrols on this peninsula. Penang lies inside the republic, so he is now a citizen of it - and his party is the only organisation inside the republic with an unbroken genealogy from the 1930s, older than the governing party and older than the state itself. \n\nHis half is the Chinese half: a tax base that is at once expressly suppressed and expressly needed. It can be openly atheistic, openly internationalist, openly armed, because it answers to no mosque; the price is that it can never cross the ethnic line, and that line is the foundation of the republic."
	MLY_Aidit:0 "Dipa Nusantara Aidit"
	MLY_Aidit_DESC:0 "Head of the Communist Party of Indonesia inside the republic. He is the most dangerous kind of man in this country: a citizen of the republic who works for a centre the republic cannot reach. \n\nBorn at Tanjung Pandan on Belitung in 1923 - and in this timeline Belitung belongs to the republic. He went to Java as a boy; under the Occupation he sat through political lectures by Sukarno, Hatta, Amir Sjarifuddin, Subardjo and Ki Hajar Dewantoro at the Menteng 31 dormitory, joined the Free Indonesia Movement in 1943 and chaired its political council, and in 1944 was chosen for the hundred men most loyal to Sukarno. A year before independence he studied at the Asrama Indonesia Merdeka, financed by Rear Admiral Maeda and run by Wikana, alongside Lukman, Sidik Kertapati and Chalid Rasjidi. \n\nThree things fix his position in 1962. He is Sukarno's man - Japan holds not only Sukarno but also a handful of young men who swore loyalty to him, and Aidit is one of them. The school that educated him was paid for by the Japanese Navy, and Sjahrir suspected from the start that its purpose was to breed infiltrators into the left-wing underground and split it into a pro-Moscow and a nationalist wing. And his party centre is in Java, inside the Sultanate and the Confederation: he has a body here and no head. \n\nThat division of labour between the two red parties is the point: the Malays are his, the Chinese are Chin Peng's. His half must practise communism inside Islam - no open atheism, no open internationalism, only land and the poor, spoken in mosques, religious schools, unions and villages. The republic happens to hold a machine built exactly for him: Sulaiman ar-Rasuli's sharia court, which can rule on whether his people are still Muslims at all."
	MLY_Rashid_Maidin:0 "Rashid Maidin"
	MLY_Rashid_Maidin_DESC:0 "Secretary of the PKI Peninsula Bureau. He was the first Malay member of the Communist Party of Malaya and commander of its wholly Malay 10th Regiment before he crossed over to the PKI - the only living knot between the two red parties, and the only man both of them must bid for. \n\nBorn in October 1917 at Kampung Gunung Mesah, Gopeng, Perak. Poverty took him out of school after standard five; he learned basic English from a missionary while working odd jobs in the Cameron Highlands, then returned to Gopeng to work at a French-owned power station and took a first-class electrical chargeman's certificate - he is a worker, not a student, which is rare in the left of this archipelago. Inspired since childhood by Maharajalela's anti-colonial resistance in Perak, he came to the party in 1939 and joined it formally in 1941 as its first Malay. He was among the highest-ranking Malays in the anti-Japanese resistance; after the war Chin Peng personally entrusted him, with Abdullah C.D., with the 10th Regiment. In 1947 he represented the party at a communist council in London; at the Baling talks of 1955 the delegation was Chin Peng, him and Chen Tien - a Chinese secretary-general, a Malay commander and a Chinese propaganda chief, a composition that was itself the party's advertisement. \n\nIn 1962 his position is this: the man who promoted him is Chin Peng, but Chin Peng's party is Chinese; the man who can offer him a party a Malay can enter with his faith intact is Aidit, but Aidit's centre is in Java. He is the only man both parties must bid for, and his own community has only one of him."
	MLY_Sulaiman_ar_Rasuli:0 "Sulaiman ar-Rasuli"
	MLY_Sulaiman_ar_Rasuli_DESC:0 "Founder of PERTI, pillar of the kaum tua, and head of the sharia court of Central Sumatra since 17 January 1947. In 1962 he is ninety-one, and the fact that he is still alive is itself the collateral of this system. \n\nBorn at Candung in Agam in 1871; in 1881 he learned the Quran at Batuhampar under Abdurrahman - who was Mohammad Hatta's grandfather, so that the republic's religious authority and its most senior technocrat share a single chain of teaching. He went to Mecca in 1903, opened his surau at Candung in 1908, and founded PERTI in 1928 with Muhammad Jamil Jaho and others. Under the Occupation he chaired the High Islamic Council the Japanese had set up, and in 1943 he represented Minangkabau at the ulama conference in Singapore. \n\nHis best-known sentence is adat basandi syarak, syarak basandi Kitabullah - custom founded on the law, the law founded on the Quran. Here that is not a motto but a price: the republic buys sharia backing for Minangkabau matriliny with it, and what it gets back is a machine that can decide who still counts as a Muslim. The machine's real target is Aidit's half of the left - a current that must practise communism inside Islam and therefore fears nothing so much as expulsion. Under matriliny, expulsion from the clan is erasure from the world."
	MLY_Rahmah_El_Yunusiyah:0 "Rahmah el Yunusiyah"
	MLY_Rahmah_El_Yunusiyah_DESC:0 "Founder in 1923 of Diniyah Putri, the first known Islamic school for girls in the Indies, and the voice of the clan elders inside the machinery of the state. \n\nBorn at Padang Panjang in 1900 into an ulama family - her father a qadi, her grandfather a Naqshbandi leader and astronomer. Married off in 1916 and forced to leave school, she obtained a divorce in 1922 after her husband took two more wives and went back to her studies. Her school opened with seventy-one pupils, mostly young housewives from the neighbourhood. She refused every Dutch subsidy and was imprisoned by the Dutch for it. In 1955 she became one of the first women elected to the Consultative Assembly - on the Masyumi ticket, that is, for the opposition. \n\nWhat made her work possible was Minangkabau matriliny itself: women hold clan standing and dispose of property as Bundo Kanduang, and that is why she was free to build a school. The republic's awkward fact - that the authority of matriliny sits with women - becomes political fact in her for the first time, and she stands on the opposition side of the house. Behind the third door there is not a roomful of elders but a woman who has run a school for forty years."
	MLY_Adnan_Kapau_Gani:0 "Adnan Kapau Gani"
	MLY_Adnan_Kapau_Gani_DESC:0 "Physician, first governor of South Sumatra, the man who moved the oil and the smuggled arms - and the President's personal doctor. He is the one man in the party with the standing to say no. \n\nBorn at Palembayan in West Sumatra in 1905, son of a teacher, graduated from STOVIA in 1926. In his youth a member of Jong Java and Jong Sumatera, he funded the 1928 Youth Congress out of a boarding house and a second-hand bookshop, and in 1941 starred in the film Asmara Moerni. \n\nAfter the Japanese came he refused to collaborate and was arrested in September 1943 and held until October 1944 - a rare clean stretch of record inside the governing party. He practised medicine until the occupation ended, then served as the first governor of South Sumatra in 1945-46, arguing that Palembang's oil could buy international support; he negotiated with Shell while running arms past the blockade, on the strength of his contacts in the Chinese community of Singapore. \n\nThe picture in 1962: a Minangkabau doctor who went to a Japanese prison for refusing to work with Japan is treating a Minangkabau president who reached office on Japanese backing. He knows every day how long the President has left, and all six factions want to buy that information; the year in his file is what entitles him to sell it to nobody."
	MLY_Awaluddin_Djamin:0 "Awaluddin Djamin"
	MLY_Awaluddin_Djamin_DESC:0 "Minangkabau police officer born at Padang, head of the national police, fifth member of the National Security Council. \n\nBorn 1927, he entered the police in 1950 and rose to become Chief of the Indonesian National Police. At thirty-five in 1962 he is one of the few young technocrats of this system: he belongs to no faction and carries no 1942 account, because in 1942 he was a child. \n\nThat cleanliness is precisely his value here. The Minangkabau graduates of the Japanese police school in Singapore in July 1942 are the skeleton of the republic's administrative and coercive machine, and every one of them carries the occupation's stamp on his record. Djamin is among the first who does not have to explain that stamp. What he controls is police, registry and censorship - the only eyes this state has that can see, in real time, what the Chinese communities are doing."
	MLY_Tan_Siew_Sin:0 "Tan Siew Sin"
	MLY_Tan_Siew_Sin_DESC:0 "A Malacca Baba, heir to a family plantation, and the most useful voice in the Chinese chambers of commerce. \n\nBorn at Malacca in 1916, only son of Tan Cheng Lock. He speaks no Chinese - his world is the Baba commercial network, the colonial administration and an English education, not the clan halls, the Chinese schools and the dialect groups. Tuberculosis in 1935 and an operation in Switzerland; recalled from London by his father in 1939 to take over the family business, with a single year of law behind him. Elected for Malacca in 1955, he held commerce and industry and then finance for many years, and took the presidency of the MCA in 1961. \n\nIn this timeline he occupies an extreme position: the Chinese of the peninsula may neither vote, nor serve, nor represent themselves, yet they hold the commerce and the tax base of the towns. That is exactly what the republic wants - a man with money and without a suspect ethnic loyalty to act as the Chinese community's representative. He will collect the taxes, stand surety and put out fires in the Chinese quarters, on one condition: that the state does not drive the Chinese into the jungle. There is somebody in the jungle waiting."
	SHO_Fujiwara_Iwaichi:0 "Iwaichi Fujiwara"
	SHO_Fujiwara_Iwaichi_DESC:0 "Shonan liaison officer at Medan, Lieutenant General, founding commander of the F Kikan. He is the only man in this drama who knew everybody already in 1942. \n\nBorn 1908, posted to Imperial General Headquarters intelligence for South and Southeast Asia in 1939, he established the F Kikan in September 1941 under the motto of ultimate sincerity. His brief was to contact the Indian independence movement, the overseas Chinese and the Malay sultans, and his record in this timeline reads like a personnel file of the founding of the republic: through a religious teacher in Kedah he reached Aceh's PUSA, and on the night of 11 March 1942 F Kikan men and PUSA irregulars took Banda Aceh so that the Imperial Guard Division landed next morning into a city already held; he rescued Sultan Abdul Hamid Halim of Kedah and his family; he tried to mobilise the Kesatuan Melayu Muda, with limited effect because the British had arrested most of its leaders; and in West Sumatra, where his resources were greatest, his people tracked down Sukarno's hiding place at Padang. He was based in Singapore at the end of the war. \n\nIn 1962 he sits in the National Security Council room in Medan - not a member, but present every time. The PUSA he raised was later turned on and crushed by Japan and became the republic's only blood debt; the KMM he approached was suppressed by Japan and then, in 1947, was handed the very map it had dreamed of; the Sukarno he found out is now held in the city-state next to his own posting; and the Minangkabau highlands he worked are what produced the men who now rule this country. He knows how all of it happened because his hands did it."
	ABD_Baba_Masao:0 "Masao Baba"
	ABD_Baba_Masao_DESC:0 "Military governor of North Borneo for the Imperial Japanese Army, Lieutenant General. Commander of the 4th Division in Sumatra from September 1943, then of the 37th Army in Borneo, and military governor of Sabah from December 1944. \n\nBorn at Kumamoto in 1892; a cavalryman, he commanded the 53rd Division, then the 4th Division in Sumatra, and finally Borneo, where he organised anti-guerrilla operations in the interior - work that has never ended in this timeline, because Japan never left. \n\nBorneo is cut in two: the north to the Army, the south to the Navy. Each side has its own headquarters, its own kempeitai, its own intelligence net and its own ledger. He fights not only the guerrillas in the jungle but the Navy across the line - for the docks, the rubber, the oil quotas, and for who turns the local collaborators into his own men first. He is seventy in 1962 and still in post."
	JJK_Maeda_Tadashi:0 "Tadashi Maeda"
	JJK_Maeda_Tadashi_DESC:0 "Civil governor of Jakaruta and Secretary-General of the Nusantara Confederation, Rear Admiral - the other hand Japan has in the south seas: Fujiwara ran the guns, Maeda ran the school. \n\nBorn at Kajiki in Kagoshima in 1898 into a former samurai family, his father a school principal. Naval attache to the Netherlands in 1940, he went to Batavia that October to negotiate oil while running espionage and building a fifth column with Japanese civilians such as Nishijima. Dispatched again to Batavia in August 1942 as liaison between the Sixteenth Army and the navy. After Koiso promised Indonesian independence in October 1944 he financed the Asrama Indonesia Merdeka, which he described as intended to raise a younger generation of Indonesian leaders. \n\nThat school was the cradle of the Indonesian left: Aidit, Lukman, Sidik Kertapati and Chalid Rasjidi studied there under Wikana, a pro-Soviet communist leader. Sjahrir suspected at the time that its real purpose was to breed infiltrators into the communist underground and divide it; there are also accounts that Maeda's circle quietly supported Tan Malaka. In the small hours of 17 August 1945 Sukarno, Hatta and Subardjo drafted the proclamation of independence in his house. \n\nIn this timeline the school did not close with the war - it became the cadet academy of the Nusantara Confederation and has been running for nearly twenty years. He is sixty-four in 1962, still insisting that his support for Indonesian independence was sincere, and still willing to tell the story to anyone who will listen. His proudest work is now underground in Medan."

	ABD_Kamada_Michiaki:0 "Michiaki Kamada"
	ABD_Kamada_Michiaki_DESC:0 "Commander of the 22nd Naval Special Base Force, Vice Admiral, and naval military governor of Dutch Borneo. The coast, the oil belt and the northern half of the island are his. \\n\\nBorn at Ehime in 1890, graduate of the 39th class of the Naval Academy in 1911; promoted rear admiral in 1941. Serving with the 8th Fleet in New Guinea between 1942 and 1943 he ordered the execution of three Allied prisoners, one of them Leonard Siffleet - the only beheading of a Western prisoner of war in the whole conflict that was captured on film. From 23 August 1944 he commanded the 22nd Naval Special Base Force at Balikpapan, which made him military governor of Dutch Borneo. \\n\\nBorneo is cut in two: the coast, the oil and the rivers belong to the Navy, that is to him; South Kalimantan and the interior belong to the Army's 37th, that is to Baba Masao. Each side keeps its own kempeitai, its own intelligence net and its own ledger, and they contend for the docks, the rubber and the oil quotas. The heaviest entry in his ledger is the Pontianak affair: between 1943 and 1944 the Navy arrested and massacred more than twenty thousand people in West Kalimantan, including every one of the Malay sultans of Kalimantan. In our world that account was settled at Pontianak on 18 October 1947 by a Dutch military court, with a rope. \\n\\nThere is no such court in this one. He is seventy-two, still in post, still fighting the Army for the oil at Balikpapan. And the head of the collaboration regime he has set up is the sole surviving son of the sultan whose family he exterminated in 1944."
	ABD_Sultan_Hamid_II:0 "Sultan Hamid II"
	ABD_Sultan_Hamid_II_DESC:0 "Sultan of Pontianak and head of the collaboration regime in West Kalimantan - the only man on this island who is at once a king and a Japanese hostage. \\n\\nBorn at Pontianak in 1913 as Syarif Hamid Alkadrie. He was in Java when the Japanese came in 1942 and was interned there for three years - which is why, on 28 June 1944, he was not present: the Japanese Navy killed his father Sultan Syarif Muhammad Alkadrie at Pontianak that day, beheaded two of his brothers and twenty-eight other males of the house, and executed every one of the twelve Malay sultans of West Kalimantan, the 'twelve tokoh'. He was the only male of his family left alive, because he was in a Japanese prison. \\n\\nWhat he inherited on his release in 1945 was a country with no aristocracy: to forestall opposition Japan had torn out the Malay upper class by the roots, and the vacancy was filled by a new Dayak elite that answers to the jungle rather than to the palace. Dutch-educated, multilingual and administratively capable, he is in our world the designer of the Indonesian national emblem Garuda Pancasila and the one-time head of the Special Region of West Kalimantan, and a federalist rather than a unitary man. \\n\\nIn 1962 he is forty-nine, in good health, in possession of a legitimacy Japan cannot kill and of a throne Japan can give. He is a federalist - which is precisely the doctrine Tokyo is pushing in the eastern archipelago. Japan needs a Pontianak man as its collaborator, and Pontianak has exactly one Pontianak royal left."
	MLY_Sirajuddin_Abbas:0 "Sirajuddin Abbas"
	MLY_Sirajuddin_Abbas_DESC:0 "Chairman of PERTI and the man who actually runs the kaum tua. In 1962 he is in his fifties, while the man who holds the sharia court is ninety-one. \\n\\nHe is the son of Abbas Qadhi, the cleric who in 1918 turned his surau at Bukittinggi into a modern school and so began the modernisation of traditionalist education in Minangkabau. He went to Mecca in 1933, took over his father's school on his return, made his name within three years as a teacher and preacher, and was elected chairman of PERTI at its third congress in Bukittinggi in 1936 - a post he has held for twenty-six years. From 1937 he ran the party paper Soearti until it ceased in 1942; that journal was the organisation's second bloodstream after the mosques. \\n\\nHis position inside the system is a crack. PERTI's founder Sulaiman ar-Rasuli chairs the Central Advisory Council and is the nominal head of the republic's religious authority, holding the sharia court of Central Sumatra since 1947; but the party, the seats, the votes and every negotiation with the government are Abbas's work. The machine this state uses to decide who still counts as a Muslim is therefore owned in name by a ninety-one-year-old and operated by a party chairman in his fifties. \\n\\nHe also carries a hidden line: in the 1950s the Acehnese branch of PERTI, under Muda Waly al-Khalidi, organised the Badan Keinsyafan Rakyat and fought Darul Islam in arms. On the Aceh question the traditionalists stand with the government - and the government they stand with bought them with a licence for the religious courts."